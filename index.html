<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FeedTrack Kenya - Bags 20-100kg</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>/* same style as before - kept short for upload */:root{--green:#087443;--dark:#064e32;--light:#eaf7ef;--bg:#f4f8f6;--text:#17362a;--muted:#718278;--border:#e1ebe5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:72px;padding:0 22px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{width:43px;height:43px;border-radius:14px;background:var(--light);display:grid;place-items:center;font-size:25px}.layout{display:flex;min-height:calc(100vh - 72px)}.sidebar{width:218px;background:#fff;border-right:1px solid var(--border);padding:20px 12px}.nav-btn{width:100%;border:0;background:transparent;padding:13px 12px;border-radius:10px;text-align:left;display:flex;gap:11px}.nav-btn.active{background:var(--light);color:var(--green);font-weight:700}main{flex:1;padding:22px}.welcome{border-radius:16px;padding:25px;color:#fff;margin-bottom:20px;background:linear-gradient(110deg,#075b3a,#13834d);display:flex;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:17px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}th{background:#f7faf8}.field{width:100%;border:1px solid #cfddd4;border-radius:8px;padding:11px;background:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid label{font-size:12px;font-weight:700}.primary{background:var(--green);color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700}.secondary{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px 13px}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--light);color:var(--green);font-size:10px}.empty{color:var(--muted);text-align:center;padding:20px}.notice{background:#fff7e8;color:#85530d;padding:12px;border-radius:9px;margin-bottom:15px;font-size:12px}.mobile-nav{display:none}@media(max-width:650px){.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);justify-content:space-around;padding:7px}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px}.mobile-nav button.active{color:var(--green)}.form-grid{grid-template-columns:1fr}main{padding-bottom:80px}}</style></head><body>
<header class="topbar"><div class="brand"><div class="logo">🌿</div><div><h1>FeedTrack Kenya</h1><p style="font-size:11px;color:var(--muted);margin:0">Bags 20-100kg Optional</p></div></div><div style="text-align:right"><strong>My Agrovet</strong><br><span style="color:var(--muted);font-size:12px">LIVE Supabase</span></div></header>
<div class="layout"><aside class="sidebar"><nav id="side-nav"></nav></aside><main id="main-content"></main></div><nav class="mobile-nav" id="mobile-nav"></nav>
<script>
"use strict";
const SUPABASE_URL="https://torzbgvwjhthzuifdses.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnpiZ3Z3amh0aHp1aWZkc2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODQ4OTAsImV4cCI6MjEwODg2MDg5MH0.Jjzgt-mCxA94Y1lG6fLDLupteE8RZs6dygJO5BVClKY";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let demoProducts=[], demoSales=[], demoDebts=[];
const categories=[["Animal Feeds","🌾"],["Seeds","🌱"],["Fertilizers","🪴"],["Pesticides","🧴"],["Veterinary Products","🐄"],["Farming Equipment","🛠️"]];
const navItems=[["Dashboard","⌂"],["Products","▦"],["Stock","📦"],["Sales","🛒"],["Customers / Debts","👥"],["Suppliers","🚚"],["Expenses","💳"],["Reports","▤"],["Staff","♙"],["Settings","⚙"]];
let currentPage="Dashboard",productFilter="",searchTerm="";
const money=a=>"KSh "+Number(a).toLocaleString("en-KE",{maximumFractionDigits:2});
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function loadAll(){
  const p=await supa.from('products').select('*').order('created_at',{ascending:false}).limit(200);
  if(!p.error&&p.data) demoProducts=p.data.map(d=>({id:d.id,name:d.name,category:d.category,quantity:Number(d.quantity),unit:d.unit,bag_weight:d.bag_weight?Number(d.bag_weight):(d.unit==='bags'?50:1),cost:Number(d.cost),price:Number(d.price)}));
  const s=await supa.from('sales').select('*').order('created_at',{ascending:false}).limit(200);
  if(!s.error&&s.data) demoSales=s.data.map(r=>({id:r.id,date:new Date(r.created_at).toLocaleDateString(),product:r.product_name,quantity:Number(r.quantity),unit:r.unit,amount:Number(r.amount),payment:r.payment}));
  const c=await supa.from('customers').select('*').order('created_at',{ascending:false}).limit(200);
  if(!c.error&&c.data) demoDebts=c.data.map(r=>({id:r.id,customer:r.name,phone:r.phone,amount:Number(r.amount)}));
  render();
}
function renderNavigation(){
  const makeButtons=mobile=>navItems.map(([name,icon])=>{
    if(mobile&&!["Dashboard","Products","Sales","Customers / Debts","Settings"].includes(name)) return "";
    const label=name==="Customers / Debts"?"Debts":name;
    if(mobile){return `<button class="${currentPage===name?"active":""}" data-page="${name}" type="button"><span>${icon}</span><br>${label}</button>`;}
    return `<button class="nav-btn ${currentPage===name?"active":""}" data-page="${name}" type="button"><span>${icon}</span><span>${name}</span></button>`;
  }).join("");
  document.getElementById("side-nav").innerHTML=makeButtons(false);
  document.getElementById("mobile-nav").innerHTML=makeButtons(true);
  document.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;searchTerm="";productFilter="";render();window.scrollTo({top:0})})});
}
function card(title,content){return `<section class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">${title}</h3></div>${content}</section>`;}
function renderDashboard(){
  const stockValue=demoProducts.reduce((s,p)=>s+p.quantity*(p.cost*(p.unit==='bags'?1:1)),0);
  const todaySales=demoSales.reduce((s,x)=>s+x.amount,0);
  return `<section class="welcome"><div><h2>Welcome to FeedTrack Kenya 🌿</h2><p>Bags 20-100kg optional — each product has its own weight.</p><span style="display:inline-block;margin-top:10px;padding:5px 8px;border:1px solid #ffffff70;border-radius:7px;font-size:11px">LIVE · ${demoProducts.length} products, ${demoSales.length} sales</span></div><div style="font-size:50px">🌾</div></section>
  <div class="stats">
    <section class="card"><div>📦 Stock Value</div><div style="font-size:20px;font-weight:800;margin:8px 0">${money(demoProducts.reduce((s,p)=>s+p.quantity*p.cost,0))}</div><div style="color:var(--muted);font-size:11px">${demoProducts.length} live</div></section>
    <section class="card"><div>🛒 Sales</div><div style="font-size:20px;font-weight:800;margin:8px 0">${money(todaySales)}</div><div style="color:var(--muted);font-size:11px">${demoSales.length} trans</div></section>
    <section class="card"><div>💰 Debts</div><div style="font-size:20px;font-weight:800;margin:8px 0">${money(demoDebts.reduce((s,d)=>s+d.amount,0))}</div><div style="color:var(--muted);font-size:11px">${demoDebts.length} customers</div></section>
    <section class="card"><div>⚠️ Low Stock</div><div style="font-size:20px;font-weight:800;margin:8px 0">${demoProducts.filter(p=>p.quantity<=5).length}</div><div style="color:var(--muted);font-size:11px">Needs reorder</div></section>
  </div>
  ${card("Recent live sales",`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Pay</th></tr></thead><tbody>${demoSales.slice(0,5).map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(s.product)}</td><td>${s.quantity} ${escapeHTML(s.unit)}</td><td>${money(s.amount)}</td><td><span class="pill">${escapeHTML(s.payment)}</span></td></tr>`).join("")||`<tr><td colspan="5">No sales</td></tr>`}</tbody></table></div>`)}`;
}
function renderProducts(){
  const filtered=demoProducts.filter(p=>(!productFilter||p.category===productFilter)&&p.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return `<h2>Products & Stock</h2><p style="color:var(--muted)">Add product with bag weight 20-100kg optional.</p><div class="notice">NEW: When unit = Bags, choose Bag Weight (20-100kg). Each product keeps its own weight for conversion.</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><input class="field" id="product-search" placeholder="Search..." value="${escapeHTML(searchTerm)}" style="flex:1;min-width:150px"><select class="field" id="category-filter" style="min-width:140px"><option value="">All</option>${categories.map(([n])=>`<option value="${escapeHTML(n)}" ${productFilter===n?"selected":""}>${escapeHTML(n)}</option>`).join("")}</select><button class="primary" id="add-product-btn" type="button">＋ Add Product</button></div>
  <section class="card" id="add-product-panel" hidden><h3>Add Product — Bag Weight Optional</h3><form id="add-product-form"><div class="form-grid">
  <label>Product name *<input class="field" name="productName" required placeholder="Layers"></label>
  <label>Category *<select class="field" name="category" required><option value="">Choose</option>${categories.map(([n])=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("")}</select></label>
  <label>Quantity *<input class="field" name="quantity" type="number" min="0" step="any" required placeholder="20"></label>
  <label>Store Unit *<select class="field" name="unit" id="unitSelect" required><option value="bags">Bags</option><option value="kg">Kg (loose)</option><option value="packets">Packets</option><option value="bottles">Bottles</option><option value="pieces">Pieces</option></select></label>
  <label id="bagWeightLabel">Bag Weight (kg) *<select class="field" name="bag_weight" id="bagWeightSelect" required><option value="20">20 kg</option><option value="25">25 kg</option><option value="30">30 kg</option><option value="40">40 kg</option><option value="50" selected>50 kg (standard Layers)</option><option value="70">70 kg (standard Growers/Chick)</option><option value="90">90 kg</option><option value="100">100 kg</option></select><small style="color:var(--muted)">Choose 20-100 as per supplier</small></label>
  <label>Cost KSh *<input class="field" name="cost" type="number" min="0" step="0.01" required placeholder="2500"></label>
  <label>Price KSh per bag/kg *<input class="field" name="price" type="number" min="0" step="0.01" required placeholder="2900"></label>
  </div><div style="margin-top:12px;display:flex;gap:8px"><button class="primary" type="submit">Save Live</button><button class="secondary" id="cancel-product-btn" type="button">Cancel</button></div><p id="product-form-message"></p></form></section>
  <section class="card"><div style="display:flex;justify-content:space-between"><h3>Inventory</h3><span class="pill">${filtered.length}</span></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Bag Wt</th><th>Cost</th><th>Price</th><th>Value</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><strong>${escapeHTML(p.name)}</strong><br><small style="color:var(--muted)">${escapeHTML(p.category)}</small></td><td>${p.quantity} ${escapeHTML(p.unit)}</td><td>${p.unit==='bags'?p.bag_weight+' kg':'-'}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.quantity*p.cost)}</td></tr>`).join("")||`<tr><td colspan="6">No products</td></tr>`}</tbody></table></div></section>`;
}
function renderSales(){
  return `<h2>Sales — Bags 20-100kg LIVE</h2><p style="color:var(--muted)">Sale unit converts using product's own bag weight.</p><div class="notice">Choose product → auto shows its bag weight (e.g. Layers 50kg). If you sell in Kgs, price = Price/BagWeight.</div>
  <section class="card"><h3>Record New Sale</h3><form id="sale-form"><div class="form-grid">
  <label>Product *<select class="field" name="saleProduct" id="saleProduct" required><option value="">Choose</option>${demoProducts.map(p=>`<option value="${p.id}">${escapeHTML(p.name)} — ${p.quantity} ${escapeHTML(p.unit)} ${p.unit==='bags'?'('+p.bag_weight+'kg)':''} @ ${money(p.price)}</option>`).join("")}</select></label>
  <label>Sale Unit *<select class="field" name="saleUnit" id="saleUnit" required><option value="bags">Bags</option><option value="kg">Kgs (loose)</option></select><small id="bagInfo" style="color:var(--muted)"></small></label>
  <label>Quantity *<input class="field" name="saleQty" id="saleQty" type="number" min="0.01" step="any" required placeholder="2"><small id="calcPreview" style="color:var(--green);font-weight:700"></small></label>
  <label>Payment *<select class="field" name="salePay" required><option value="M-PESA">M-PESA</option><option value="Cash">Cash</option><option value="Credit">Credit</option><option value="Bank">Bank</option></select></label>
  </div><div style="margin-top:12px"><button class="primary" type="submit">Record Sale Live</button></div><p id="sale-msg"></p></form></section>
  <section class="card"><h3>All Live Sales</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Pay</th></tr></thead><tbody>${demoSales.map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(s.product)}</td><td>${s.quantity} ${escapeHTML(s.unit)}</td><td>${money(s.amount)}</td><td><span class="pill">${escapeHTML(s.payment)}</span></td></tr>`).join("")||`<tr><td colspan="5">No sales</td></tr>`}</tbody></table></div></section>`;
}
function renderDebts(){return `<h2>Customers & Debts</h2><section class="card"><h3>Add Debt</h3><form id="debt-form"><div class="form-grid"><label>Name *<input class="field" name="custName" required></label><label>Phone<input class="field" name="custPhone"></label><label>Amount *<input class="field" name="custAmount" type="number" required></label></div><button class="primary" type="submit" style="margin-top:12px">Save Live</button><p id="debt-msg"></p></form></section><section class="card"><h3>Outstanding</h3><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Balance</th></tr></thead><tbody>${demoDebts.map(d=>`<tr><td>${escapeHTML(d.customer)}</td><td>${escapeHTML(d.phone||"")}</td><td>${money(d.amount)}</td></tr>`).join("")||`<tr><td colspan="3">No debts</td></tr>`}</tbody></table></div></section>`;}
function renderBasic(t,d){return `<h2>${t}</h2><p style="color:var(--muted)">${d}</p><section class="card"><div class="empty">Planned next stage — LIVE project</div></section>`;}
function render(){
  renderNavigation();
  const c=document.getElementById("main-content");
  const pages={"Dashboard":renderDashboard,"Products":renderProducts,"Stock":()=>renderBasic("Stock","Stock overview"),"Sales":renderSales,"Customers / Debts":renderDebts,"Suppliers":()=>renderBasic("Suppliers","Suppliers"),"Expenses":()=>renderBasic("Expenses","Expenses"),"Reports":()=>renderBasic("Reports","Reports"),"Staff":()=>renderBasic("Staff","Staff"),"Settings":()=>renderBasic("Settings","Settings")};
  c.innerHTML=(pages[currentPage]||renderDashboard)();
  c.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;render()})});
  const addBtn=document.getElementById("add-product-btn"); const panel=document.getElementById("add-product-panel"); const form=document.getElementById("add-product-form");
  const unitSelect=document.getElementById("unitSelect"); const bagWeightLabel=document.getElementById("bagWeightLabel"); const bagWeightSelect=document.getElementById("bagWeightSelect");
  function toggleBagWeight(){ if(!unitSelect||!bagWeightLabel) return; bagWeightLabel.style.display=unitSelect.value==='bags'?'block':'none'; if(bagWeightSelect) bagWeightSelect.required=unitSelect.value==='bags'; }
  if(unitSelect){unitSelect.addEventListener("change",toggleBagWeight); toggleBagWeight();}
  if(addBtn){addBtn.addEventListener("click",()=>{panel.hidden=false; panel.scrollIntoView({behavior:"smooth"})})}
  const cancel=document.getElementById("cancel-product-btn"); if(cancel) cancel.addEventListener("click",()=>{panel.hidden=true});
  if(form){form.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(form); const name=String(fd.get("productName")||"").trim(); const category=String(fd.get("category")||""); const unit=String(fd.get("unit")||""); const bag_weight=unit==='bags'?Number(fd.get("bag_weight")):1; const quantity=Number(fd.get("quantity")); const cost=Number(fd.get("cost")); const price=Number(fd.get("price")); const msg=document.getElementById("product-form-message"); if(!name||!category||!unit){msg.textContent="Fill all";return;} msg.textContent="Saving..."; const {error}=await supa.from('products').insert([{name,category,quantity,unit,bag_weight,cost,price}]); if(error){ if(error.message.includes("bag_weight")){ const {error:e2}=await supa.from('products').insert([{name,category,quantity,unit,cost,price}]); if(e2) msg.textContent=e2.message; else await loadAll(); } else msg.textContent=error.message; } else await loadAll(); });}
  const search=document.getElementById("product-search"); if(search){search.addEventListener("input",ev=>{searchTerm=ev.target.value; render(); const n=document.getElementById("product-search"); if(n){n.focus();}})}
  const filt=document.getElementById("category-filter"); if(filt){filt.addEventListener("change",ev=>{productFilter=ev.target.value; render()})}
  const saleForm=document.getElementById("sale-form"); const saleProd=document.getElementById("saleProduct"); const saleUnit=document.getElementById("saleUnit"); const saleQty=document.getElementById("saleQty"); const calc=document.getElementById("calcPreview"); const bagInfo=document.getElementById("bagInfo");
  function updatePreview(){
    if(!saleProd||!saleQty) return; const prodId=Number(saleProd.value); const qty=Number(saleQty.value); const sUnit=saleUnit?saleUnit.value:"bags"; const prod=demoProducts.find(p=>p.id===prodId);
    if(!prod||!qty){if(calc) calc.textContent=""; if(bagInfo) bagInfo.textContent=""; return;}
    if(bagInfo) bagInfo.textContent=prod.unit==='bags'?`This product: 1 bag = ${prod.bag_weight}kg`:`Stored as ${prod.unit}`;
    let pricePerUnit=prod.price; if(prod.unit==='bags' && sUnit==='kg') pricePerUnit=prod.price/prod.bag_weight; if(prod.unit==='kg' && sUnit==='bags') pricePerUnit=prod.price*prod.bag_weight;
    const amount=qty*pricePerUnit; if(calc) calc.textContent=`= ${money(amount)} (${qty} ${sUnit} @ ${money(pricePerUnit)}/${sUnit})`;
  }
  if(saleProd){saleProd.addEventListener("change",updatePreview);} if(saleUnit){saleUnit.addEventListener("change",updatePreview);} if(saleQty){saleQty.addEventListener("input",updatePreview);}
  if(saleForm){saleForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(saleForm); const prodId=Number(fd.get("saleProduct")); const qty=Number(fd.get("saleQty")); const sUnit=String(fd.get("saleUnit")); const pay=String(fd.get("salePay")); const msg=document.getElementById("sale-msg"); const prod=demoProducts.find(p=>p.id===prodId); if(!prod){msg.textContent="Choose product";return;}
    let qtyToDeduct=qty; if(prod.unit==='bags' && sUnit==='kg') qtyToDeduct=qty/prod.bag_weight; else if(prod.unit==='kg' && sUnit==='bags') qtyToDeduct=qty*prod.bag_weight;
    if(qtyToDeduct>prod.quantity){msg.textContent=`Not enough! Only ${prod.quantity} ${prod.unit} left. Need ${qtyToDeduct.toFixed(2)}`; msg.style.color="#b83232"; return;}
    let pricePerUnit=prod.price; if(prod.unit==='bags' && sUnit==='kg') pricePerUnit=prod.price/prod.bag_weight; if(prod.unit==='kg' && sUnit==='bags') pricePerUnit=prod.price*prod.bag_weight;
    const amount=qty*pricePerUnit; msg.textContent=`Recording ${qty} ${sUnit} = ${money(amount)}...`;
    const {error:insErr}=await supa.from('sales').insert([{product_name:prod.name,quantity:qty,unit:sUnit,amount:amount,payment:pay}]);
    if(insErr){msg.textContent=insErr.message;msg.style.color="#b83232";return;}
    const newQty=prod.quantity-qtyToDeduct; const {error:upErr}=await supa.from('products').update({quantity:newQty}).eq('id',prodId);
    if(upErr){msg.textContent=upErr.message;return;} msg.textContent=`✅ ${qty} ${sUnit} = ${money(amount)} Saved! Stock ${prod.quantity} → ${newQty.toFixed(2)}`; msg.style.color="#087443"; await loadAll();
  });}
  const debtForm=document.getElementById("debt-form"); if(debtForm){debtForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(debtForm); const name=String(fd.get("custName")||"").trim(); const phone=String(fd.get("custPhone")||"").trim(); const amount=Number(fd.get("custAmount")); const msg=document.getElementById("debt-msg"); if(!name||!amount){msg.textContent="Fill";return;} msg.textContent="Saving..."; const {error}=await supa.from('customers').insert([{name,phone,amount}]); if(error){msg.textContent=error.message;} else {msg.textContent="Saved"; await loadAll();}});}
}
loadAll();
</script></body></html>
