#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#064e32,#13834d);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}

<script>

const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function toggleEye(btn){const id=btn.dataset.target;const input=document.getElementById(id);if(!input) return;if(input.type==='password'){input.type='text';btn.textContent='🙈';} else {input.type='password';btn.textContent='👁️';}}
document.addEventListener('click',e=>{if(e.target.classList.contains('eyeBtn')) toggleEye(e.target);});
async function fetchShops(){
  const {data,error}=await supa.from('shops').select('*').order('created_at',{ascending:true}).limit(100);
  if(error){document.getElementById('shopList').innerHTML=`<div style="padding:12px;color:#b83232">${escapeHTML(error.message)}</div>`;return [];}
  return data||[];
}
async function renderShopList(){
  const shops=await fetchShops();
  const list=document.getElementById('shopList');
  if(!shops.length){list.innerHTML='<div style="padding:12px;color:var(--muted)">No shops yet. Create Farmgate first.</div>';return;}
  list.innerHTML=shops.map(s=>{
    const hasPass=s.password?'🔒':'🔓';
    const isDeactivated=s.is_active===false;
    const style=isDeactivated?'opacity:0.6;background:#fff0ed;border-left:4px solid #b83232':'';
    return `<div class="shopItem" data-id="${s.id}" data-name="${escapeHTML(s.shop_name)}" data-loc="${escapeHTML(s.location||'')}" data-pass="${escapeHTML(s.password||'')}" data-active="${s.is_active!==false}" data-admin="${s.is_admin?'true':'false'}" style="${style}"><span><strong>${hasPass} ${escapeHTML(s.shop_name)} ${s.is_admin?'👑':''} ${isDeactivated?'⛔':''}</strong><br><small style="color:${isDeactivated?'#b83232':'var(--muted)'}">${escapeHTML(s.location||'')} • ${escapeHTML(s.phone||'')} ${s.is_admin?'👑 SUPER':''} ${isDeactivated?'⛔ DEACTIVATED':''}</small></span><span style="color:${isDeactivated?'#b83232':'var(--green)'};font-weight:700">${isDeactivated?'BLOCKED':'Enter →'}</span></div>`;
  }).join('');
  list.querySelectorAll('.shopItem').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.active==='false'){alert('⛔ SHOP DEACTIVATED! Contact Farmgate Owner. Till: 0116982197');return;}
      const shop={id:Number(el.dataset.id), name:el.dataset.name, loc:el.dataset.loc, pass:el.dataset.pass, is_admin:el.dataset.admin==='true'};
      selectedShopToEnter=shop;
      document.getElementById('passShopName').textContent=`Enter password for ${shop.name} ${shop.is_admin?'👑 SUPER':''}`;
      document.getElementById('passSection').style.display='block';
      document.getElementById('enterPass').value='';
      document.getElementById('enterPass').type='password';
      const eye=document.querySelector('[data-target="enterPass"]'); if(eye) eye.textContent='👁️';
      document.getElementById('passMsg').textContent='';

    });
  });
}
function getSavedShop(){try{return JSON.parse(localStorage.getItem('farmgate_current_shop')||'null')}catch{return null}}
function saveShop(shop){localStorage.setItem('farmgate_current_shop',JSON.stringify(shop))}
async function loginToShop(id,name,loc,is_admin){
  const shop={id,name,location:loc,is_admin:!!is_admin};
  currentShop=shop; saveShop(shop);
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('passSection').style.display='none';
  document.getElementById('headerShopName').textContent=name + (is_admin?' 👑':'');
  document.getElementById('headerShopShort').textContent=(loc||name).split(' ')[0];
  document.getElementById('headerSub').textContent=`Shop #${id} • ${loc||'Mwea'} • ${is_admin?'SUPER ADMIN':'CLIENT - Profit PIN Protected'} • LIVE`;
  await loadAll();
}
async function tryEnterWithPassword(){
  if(!selectedShopToEnter) return;
  const entered=document.getElementById('enterPass').value;
  const msg=document.getElementById('passMsg');
  if(!entered){msg.textContent='Enter password';return;}
  const {data: freshShop} = await supa.from('shops').select('*').eq('id', selectedShopToEnter.id).single();
  if(freshShop && freshShop.is_active === false){ msg.textContent='⛔ DEACTIVATED! Contact Owner.'; return; }
  if(!selectedShopToEnter.pass){
    if(confirm(`Shop ${selectedShopToEnter.name} has NO password. Enter?`)){
      await loginToShop(selectedShopToEnter.id,selectedShopToEnter.name,selectedShopToEnter.loc, freshShop?freshShop.is_admin:false);
    }
    return;
  }
  if(entered===selectedShopToEnter.pass){
    await loginToShop(selectedShopToEnter.id,selectedShopToEnter.name,selectedShopToEnter.loc, freshShop?freshShop.is_admin:false);
  }else{ msg.textContent='❌ Wrong password!'; }
}
async function initLogin(){
  const saved=getSavedShop();
  await renderShopList();
  if(saved && saved.id){
    const {data}=await supa.from('shops').select('*').eq('id',saved.id).maybeSingle();
    if(data){ 
      if(data.is_active===false){ localStorage.removeItem('farmgate_current_shop'); alert('⛔ Your shop DEACTIVATED.'); document.getElementById('loginOverlay').style.display='flex'; return; }
      await loginToShop(data.id,data.shop_name,data.location, data.is_admin); return; 
    }
  }
  document.getElementById('loginOverlay').style.display='flex';
}
async function createShop(){
  const nameEl=document.getElementById('newShopName'); const phoneEl=document.getElementById('newShopPhone'); const locEl=document.getElementById('newShopLocation'); const passEl=document.getElementById('newShopPass'); const msg=document.getElementById('loginMsg');
  const shop_name=(nameEl.value||'').trim(); const phone=(phoneEl.value||'').trim(); const location=(locEl.value||'Mwea').trim()||'Mwea'; const password=(passEl.value||'').trim();
  if(!shop_name){msg.textContent='Shop name required';return;}
  if(!phone){msg.textContent='Phone required';return;}
  if(!password){msg.textContent='Password required!';return;}
  if(password.length<4){msg.textContent='Min 4 chars';return;}
  msg.style.color='#718278'; msg.textContent='Creating...';
  const {data,error}=await supa.from('shops').insert([{shop_name,phone,location,password,profit_pin:password,is_active:true,is_admin:false}]).select().single();
  if(error){ msg.style.color='#b83232'; msg.textContent=error.message; return; }
  msg.style.color='#087443'; msg.textContent='Created! Profit PIN = Shop Password (change in Settings)';
  await loginToShop(data.id,data.shop_name,data.location,false);
  await renderShopList();
}
document.getElementById('logoutBtn').addEventListener('click',()=>{if(currentShop) sessionStorage.removeItem(`profit_unlocked_${currentShop.id}`); localStorage.removeItem('farmgate_current_shop'); currentShop=null; demoProducts=[]; demoSales=[]; demoDebts=[]; document.getElementById('loginOverlay').style.display='flex'; document.getElementById('passSection').style.display='none'; renderShopList();});
document.getElementById('createShopBtn').addEventListener('click',createShop);
document.getElementById('confirmEnter').addEventListener('click',tryEnterWithPassword);

async function loadAll(){
  if(!currentShop) return;
  const shopId=currentShop.id;
  const p=await supa.from('products').select('*').eq('shop_id',shopId).order('created_at',{ascending:false}).limit(200);
  if(!p.error&&p.data) demoProducts=p.data.map(d=>({id:d.id,name:d.name,category:d.category,quantity:Number(d.quantity),unit:d.unit,bag_weight:d.bag_weight?Number(d.bag_weight):(d.unit==='bags'?50:1),cost:Number(d.cost),price:Number(d.price)}));
  const s=await supa.from('sales').select('*').eq('shop_id',shopId).order('created_at',{ascending:false}).limit(200);
  if(!s.error&&s.data) demoSales=s.data.map(r=>({id:r.id,date:new Date(r.created_at).toLocaleDateString(),product:r.product_name,quantity:Number(r.quantity),unit:r.unit,amount:Number(r.amount),payment:r.payment}));
  const c=await supa.from('customers').select('*').eq('shop_id',shopId).order('created_at',{ascending:false}).limit(200);
  if(!c.error&&c.data) demoDebts=c.data.map(r=>({id:r.id,customer:r.name,phone:r.phone,amount:Number(r.amount)}));
  document.getElementById('liveStatus').textContent=`LIVE • Shop #${shopId} • ${demoProducts.length} prod • Profit PIN`;
  render();
}
function renderNavigation(){
  const makeButtons=mobile=>navItems.map(([name,icon])=>{
    if(mobile&&!["Dashboard","Products","Sales","Customers / Debts","Settings"].includes(name)) return "";

  }).join("");

  document.getElementById("mobile-nav").innerHTML=makeButtons(true);
  document.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;searchTerm="";productFilter="";render();window.scrollTo({top:0})})});
}
function card(title,content){return `<section class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">${title}</h3></div>${content}</section>`;}
function calcProfits(){
  const todayStr = new Date().toLocaleDateString();
  const todaySales = demoSales.filter(s => s.date === todayStr);
  const todaySalesAmount = todaySales.reduce((sum,s)=>sum+s.amount,0);
  let todayProfit = 0;
  todaySales.forEach(sale => {
    const prod = demoProducts.find(p => p.name === sale.product);
    if(prod){
      let costPerUnit = prod.cost;
      if(prod.unit==='bags' && sale.unit==='kg') costPerUnit = prod.cost/prod.bag_weight;
      if(prod.unit==='kg' && sale.unit==='bags') costPerUnit = prod.cost*prod.bag_weight;
      todayProfit += (sale.amount - (sale.quantity * costPerUnit));
    }
  });
  let totalProfit=0;
  demoSales.forEach(sale=>{
    const prod=demoProducts.find(pr=>pr.name===sale.product);
    if(prod){
      let cpu=prod.cost;
      if(prod.unit==='bags' && sale.unit==='kg') cpu=prod.cost/prod.bag_weight;
      if(prod.unit==='kg' && sale.unit==='bags') cpu=prod.cost*prod.bag_weight;
      totalProfit+=(sale.amount-(sale.quantity*cpu));
    }
  });
  return {todayStr,todaySales,todaySalesAmount,todayProfit,totalProfit};
}

    <section class="card"><div>💵 Total Profit ${isUnlocked?'':'🔒'}</div><div style="font-size:18px;font-weight:800;margin:8px 0;color:${isUnlocked?'var(--green)':'#888'}">${isUnlocked?money(totalProfit):'•••••'}</div><div style="color:var(--muted);font-size:11px">All time • Only your shop</div></section>
  </div>
  ${card("My Sales Today - Profit Hidden Until PIN",`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Amount</th><th>Profit</th><th>Pay</th></tr></thead><tbody>${todaySales.map(s=>{
    const prod=demoProducts.find(p=>p.name===s.product); let profit=0;
    if(prod){ let cpu=prod.cost; if(prod.unit==='bags'&&s.unit==='kg') cpu=prod.cost/prod.bag_weight; if(prod.unit==='kg'&&s.unit==='bags') cpu=prod.cost*prod.bag_weight; profit=s.amount-(s.quantity*cpu); }
    return `<tr><td>${escapeHTML(s.product)}</td><td>${s.quantity} ${escapeHTML(s.unit)}</td><td>${money(s.amount)}</td><td style="color:${isUnlocked?'#087443':'#ccc'};font-weight:700">${isUnlocked?money(profit):'•••••'}</td><td><span class="pill">${escapeHTML(s.payment)}</span></td></tr>`;
  }).join("")||`<tr><td colspan="5" style="text-align:center;color:var(--muted)">No sales today - Shop #${currentShop?currentShop.id:''}</td></tr>`}</tbody></table></div><p style="font-size:11px;color:var(--muted);margin-top:8px">🔒 Profit visible only after entering Profit PIN in Settings → Owner only</p>`)}`;
}
function renderProducts(){
  const filtered=demoProducts.filter(p=>(!productFilter||p.category===productFilter)&&p.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return `<h2>Products — ${escapeHTML(currentShop?currentShop.name:'')} 🔒 ONLY MY SHOP</h2><div class="notice">Shop #${currentShop?currentShop.id:''} • Only your products • Profit PIN protects profit</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><input class="field" id="product-search" placeholder="Search my products..." value="${escapeHTML(searchTerm)}" style="flex:1;min-width:150px"><select class="field" id="category-filter" style="min-width:140px"><option value="">All</option>${categories.map(([n])=>`<option value="${escapeHTML(n)}" ${productFilter===n?"selected":""}>${escapeHTML(n)}</option>`).join("")}</select><button class="primary" id="add-product-btn" type="button">＋ Add</button><button class="secondary" id="seed-btn" type="button">Seed 15 Demo</button></div>
  <section class="card" id="add-product-panel" hidden><h3>Add Product — ONLY SHOP #${currentShop?currentShop.id:''}</h3><form id="add-product-form"><div class="form-grid">

  </div><div style="margin-top:12px;display:flex;gap:8px"><button class="primary" type="submit">Save to Shop #${currentShop?currentShop.id:''}</button><button class="secondary" id="cancel-product-btn" type="button">Cancel</button></div><p id="product-form-message"></p></form></section>
  <section class="card"><div style="display:flex;justify-content:space-between"><h3>Inventory — ONLY SHOP #${currentShop?currentShop.id:''}</h3><span class="pill">${filtered.length} products</span></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Bag Wt</th><th>Cost</th><th>Price</th><th>Value</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><strong>${escapeHTML(p.name)}</strong><br><small style="color:var(--muted)">${escapeHTML(p.category)}</small></td><td>${p.quantity} ${escapeHTML(p.unit)}</td><td>${p.unit==='bags'?p.bag_weight+' kg':'-'}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.quantity*p.cost)}</td></tr>`).join("")||`<tr><td colspan="6">No products - Shop #${currentShop?currentShop.id:''}</td></tr>`}</tbody></table></div></section>`;
}

    <div class="notice" style="background:#eaf7ef;border:1px solid #087443">👑 SUPER ADMIN — See ALL shops, Profit PIN per shop managed here</div>
    <section class="card" style="border:2px solid #087443"><h3>📊 Super Admin Page — YOU ONLY</h3><a href="/admin.html" target="_blank" style="display:inline-block;background:var(--green);color:#fff;padding:11px 18px;border-radius:9px;text-decoration:none;font-weight:700">🔐 Open Super Admin</a><p style="font-size:11px;margin-top:8px">Clients blocked from admin.html</p></section>
    <section class="card"><h3>🔒 Change Super Admin Password</h3><form id="change-pass-form"><div class="form-grid" style="grid-template-columns:1fr"><label>Current Password<div class="passInputWrap"><input class="field" id="currPass" type="password" required><button class="eyeBtn" type="button" data-target="currPass">👁️</button></div></label><label>New Password<div class="passInputWrap"><input class="field" id="newPass" type="password" required><button class="eyeBtn" type="button" data-target="newPass">👁️</button></div></label><label>Confirm<div class="passInputWrap"><input class="field" id="confirmPass" type="password" required><button class="eyeBtn" type="button" data-target="confirmPass">👁️</button></div></label></div><button class="primary" type="submit" style="margin-top:12px">Save</button><p id="changePassMsg"></p></form></section>`;
  } else {
    return `<h2>Settings — ${escapeHTML(currentShop.name)} 🔒 CLIENT MINI ADMIN</h2>
    <div class="notice">Shop #${currentShop.id} • ONLY YOUR DATA • Profit hidden behind PIN — Owner only</div>

    <section class="card" style="background:#f0faf4;border:2px solid #087443">
      <h3>📊 My Business Summary — MINI ADMIN — ONLY MY SHOP</h3>
      <p style="font-size:12px;color:var(--muted)">This is your mini admin page — Sales visible to workers, Profit visible only to owner with PIN</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
        <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid var(--border)"><div style="font-size:11px;color:var(--muted)">Today Sales (${todayStr})</div><div style="font-size:18px;font-weight:800">${money(todaySalesAmount)}</div><small>${todaySales.length} sales today • Shop #${currentShop.id}</small></div>
        <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid var(--border)"><div style="font-size:11px;color:var(--muted)">Today Profit 🔒 Owner Only</div><div id="profitDisplay" style="font-size:18px;font-weight:800;color:${isUnlocked?'#087443':'#ccc'}">${isUnlocked?money(todayProfit):'•••••• KSh'}</div>
        ${!isUnlocked?`<div style="margin-top:8px;display:flex;gap:6px"><div class="passInputWrap" style="flex:1"><input class="field" id="profitPinInput" type="password" placeholder="Enter Profit PIN" style="padding:8px"><button class="eyeBtn" type="button" data-target="profitPinInput">👁️</button></div><button class="primary" id="unlockProfitBtn" type="button" style="padding:8px 12px">Unlock</button></div><small id="pinMsg" style="color:#b83232"></small>`: `<small style="color:var(--green)">🔓 Unlocked • <button id="lockProfitBtn" type="button" style="border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer">Lock</button></small>`}
        </div>
        <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid var(--border)"><div style="font-size:11px;color:var(--muted)">Total Sales All Time</div><div style="font-size:18px;font-weight:800">${money(demoSales.reduce((s,x)=>s+x.amount,0))}</div><small>${demoSales.length} sales total</small></div>
        <div style="background:#fff;padding:12px;border-radius:8px;border:1px solid var(--border)"><div style="font-size:11px;color:var(--muted)">Total Profit All Time 🔒</div><div style="font-size:18px;font-weight:800;color:${isUnlocked?'#087443':'#ccc'}">${isUnlocked?money(totalProfit):'••••••'}</div><small>${isUnlocked?'Sales - Cost':'Owner PIN required'}</small></div>
      </div>
      <div style="margin-top:12px;background:#fff;padding:10px;border-radius:8px;font-size:12px;border:1px solid var(--border)"><strong>Privacy:</strong> Workers see sales amount, but profit = Sales - Cost is hidden. Only owner knows Profit PIN.</div>
    </section>

    <section class="card"><h3>🔒 Change Shop Password (workers use to enter shop)</h3><form id="change-pass-form"><div class="form-grid" style="grid-template-columns:1fr"><label>Current Shop Password<div class="passInputWrap"><input class="field" id="currPass" type="password" required><button class="eyeBtn" type="button" data-target="currPass">👁️</button></div></label><label>New Shop Password<div class="passInputWrap"><input class="field" id="newPass" type="password" required><button class="eyeBtn" type="button" data-target="newPass">👁️</button></div></label><label>Confirm<div class="passInputWrap"><input class="field" id="confirmPass" type="password" required><button class="eyeBtn" type="button" data-target="confirmPass">👁️</button></div></label></div><button class="primary" type="submit" style="margin-top:12px">Save Shop Password</button><p id="changePassMsg"></p></form></section>

    <section class="card" style="border:2px solid #d4a017"><h3>💰 Change Profit PIN (Owner Only — Keep Secret From Workers)</h3><form id="change-profit-pin-form"><div class="form-grid" style="grid-template-columns:1fr"><label>Current Profit PIN<div class="passInputWrap"><input class="field" id="currProfitPin" type="password" required><button class="eyeBtn" type="button" data-target="currProfitPin">👁️</button></div></label><label>New Profit PIN (4-6 digits)<div class="passInputWrap"><input class="field" id="newProfitPin" type="password" required placeholder="e.g. 7788"><button class="eyeBtn" type="button" data-target="newProfitPin">👁️</button></div></label><label>Confirm Profit PIN<div class="passInputWrap"><input class="field" id="confirmProfitPin" type="password" required><button class="eyeBtn" type="button" data-target="confirmProfitPin">👁️</button></div></label></div><button class="primary" type="submit" style="margin-top:12px;background:#d4a017">Save Profit PIN — Secret</button><p id="changeProfitPinMsg"></p></form></section>`;
  }
}
function renderBasic(t,d){return `<h2>${t} — ${escapeHTML(currentShop?currentShop.name:'')} ${currentShop&&currentShop.is_admin?'👑':'🔒'}</h2><p style="color:var(--muted)">${d} — ONLY Shop #${currentShop?currentShop.id:''}</p><section class="card"><div class="empty">Planned next — Locked Shop #${currentShop?currentShop.id:''} ONLY • Profit PIN protected</div></section>`;}
function render(){
  renderNavigation();
  const c=document.getElementById("main-content");
  const pages={"Dashboard":renderDashboard,"Products":renderProducts,"Stock":()=>renderBasic("Stock","Stock overview"),"Sales":renderSales,"Customers / Debts":renderDebts,"Suppliers":()=>renderBasic("Suppliers","Suppliers"),"Expenses":()=>renderBasic("Expenses","Expenses"),"Reports":()=>renderBasic("Reports","Reports"),"Staff":()=>renderBasic("Staff","Staff"),"Settings":renderSettings};
  c.innerHTML=(pages[currentPage]||renderDashboard)();
  c.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;render()})});
  const addBtn=document.getElementById("add-product-btn"); const panel=document.getElementById("add-product-panel"); const form=document.getElementById("add-product-form");
  const unitSelect=document.getElementById("unitSelect"); const bagWeightLabel=document.getElementById("bagWeightLabel"); const bagWeightSelect=document.getElementById("bagWeightSelect");
  function toggleBagWeight(){ if(!unitSelect||!bagWeightLabel) return; bagWeightLabel.style.display=unitSelect.value==='bags'?'block':'none'; if(bagWeightSelect) bagWeightSelect.required=unitSelect.value==='bags'; }
  if(unitSelect){unitSelect.addEventListener("change",toggleBagWeight); toggleBagWeight();}
  if(addBtn){addBtn.addEventListener("click",()=>{panel.hidden=false; panel.scrollIntoView({behavior:"smooth"})})}
  const cancel=document.getElementById("cancel-product-btn"); if(cancel) cancel.addEventListener("click",()=>{panel.hidden=true});
  const seedBtn=document.getElementById("seed-btn");
  if(seedBtn){seedBtn.addEventListener("click",async()=>{
    if(!currentShop){alert('Login first');return;}
    const demo=[{name:'Omena (Fish Meal)',category:'Animal Feeds',quantity:20,unit:'bags',bag_weight:50,cost:2800,price:3200},{name:'Sunflower Cake',category:'Animal Feeds',quantity:15,unit:'bags',bag_weight:50,cost:2200,price:2600},{name:'Black Gold - Dairy',category:'Animal Feeds',quantity:25,unit:'bags',bag_weight:70,cost:2400,price:2800},{name:'Layers Mash',category:'Animal Feeds',quantity:30,unit:'bags',bag_weight:50,cost:2500,price:2900},{name:'Growers Mash',category:'Animal Feeds',quantity:20,unit:'bags',bag_weight:70,cost:2300,price:2700},{name:'Chick Mash',category:'Animal Feeds',quantity:15,unit:'bags',bag_weight:70,cost:2600,price:3000},{name:'Kienyeji Mash',category:'Animal Feeds',quantity:18,unit:'bags',bag_weight:50,cost:2400,price:2800},{name:'Dairy Meal',category:'Animal Feeds',quantity:22,unit:'bags',bag_weight:70,cost:2350,price:2750},{name:'Maize Germ',category:'Animal Feeds',quantity:30,unit:'bags',bag_weight:50,cost:1800,price:2100},{name:'Wheat Bran',category:'Animal Feeds',quantity:25,unit:'bags',bag_weight:50,cost:1500,price:1800},{name:'Cotton Cake',category:'Animal Feeds',quantity:12,unit:'bags',bag_weight:50,cost:2100,price:2500},{name:'Maize Grain 90kg',category:'Animal Feeds',quantity:10,unit:'bags',bag_weight:90,cost:4000,price:4500},{name:'DCP Mineral',category:'Animal Feeds',quantity:50,unit:'kg',bag_weight:1,cost:120,price:150},{name:'Layers Booster',category:'Veterinary Products',quantity:100,unit:'packets',bag_weight:1,cost:200,price:300},{name:'Aflatoxin Binder',category:'Veterinary Products',quantity:80,unit:'packets',bag_weight:1,cost:180,price:250}];
    const toInsert=demo.map(d=>({...d,shop_id:currentShop.id}));
    const {error}=await supa.from('products').insert(toInsert);
    if(error) alert(error.message); else await loadAll();
  });}
  if(form){form.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(form); const name=String(fd.get("productName")||"").trim(); const category=String(fd.get("category")||""); const unit=String(fd.get("unit")||""); const bag_weight=unit==='bags'?Number(fd.get("bag_weight")):1; const quantity=Number(fd.get("quantity")); const cost=Number(fd.get("cost")); const price=Number(fd.get("price")); const msg=document.getElementById("product-form-message"); if(!name||!category||!unit){msg.textContent="Fill all";return;} msg.textContent="Saving..."; const {error}=await supa.from('products').insert([{name,category,quantity,unit,bag_weight,cost,price,shop_id:currentShop.id}]); if(error){msg.textContent=error.message;} else await loadAll(); });}
  const search=document.getElementById("product-search"); if(search){search.addEventListener("input",ev=>{searchTerm=ev.target.value; render(); const n=document.getElementById("product-search"); if(n){n.focus(); n.selectionStart=n.value.length}})}
  const filt=document.getElementById("category-filter"); if(filt){filt.addEventListener("change",ev=>{productFilter=ev.target.value; render()})}
  const saleForm=document.getElementById("sale-form"); const saleProd=document.getElementById("saleProduct"); const saleUnit=document.getElementById("saleUnit"); const saleQty=document.getElementById("saleQty"); const calc=document.getElementById("calcPreview"); const bagInfo=document.getElementById("bagInfo");
  function updatePreview(){
    if(!saleProd||!saleQty) return; const prodId=Number(saleProd.value); const qty=Number(saleQty.value); const sUnit=saleUnit?saleUnit.value:"bags"; const prod=demoProducts.find(p=>p.id===prodId);
    if(!prod||!qty){if(calc) calc.textContent=""; if(bagInfo) bagInfo.textContent=""; return;}
    if(bagInfo) bagInfo.textContent=prod.unit==='bags'?`This product: 1 bag = ${prod.bag_weight}kg`:`Stored as ${prod.unit}`;
    let pricePerUnit=prod.price; if(prod.unit==='bags' && sUnit==='kg') pricePerUnit=prod.price/prod.bag_weight; if(prod.unit==='kg' && sUnit==='bags') pricePerUnit=prod.price*prod.bag_weight;
    const amount=qty*pricePerUnit; if(calc) calc.textContent=`= ${money(amount)} (${qty} ${sUnit} @ ${money(pricePerUnit)}/${sUnit})`;
  }
  if(saleProd){saleProd.addEventListener("change",updatePreview);} if(saleUnit){saleUnit.addEventListener("change",updatePreview);} if(saleQty){saleQty.addEventListener("input",updatePreview);}
  if(saleForm){saleForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(saleForm); const prodId=Number(fd.get("saleProduct")); const qty=Number(fd.get("saleQty")); const sUnit=String(fd.get("saleUnit")); const pay=String(fd.get("salePay")); const msg=document.getElementById("sale-msg"); const prod=demoProducts.find(p=>p.id===prodId); if(!prod){msg.textContent="Choose product";return;}
    let qtyToDeduct=qty; if(prod.unit==='bags' && sUnit==='kg') qtyToDeduct=qty/prod.bag_weight; else if(prod.unit==='kg' && sUnit==='bags') qtyToDeduct=qty*prod.bag_weight;
    if(qtyToDeduct>prod.quantity){msg.textContent=`Not enough! Only ${prod.quantity} ${prod.unit} left.`; msg.style.color="#b83232"; return;}
    let pricePerUnit=prod.price; if(prod.unit==='bags' && sUnit==='kg') pricePerUnit=prod.price/prod.bag_weight; if(prod.unit==='kg' && sUnit==='bags') pricePerUnit=prod.price*prod.bag_weight;
    const amount=qty*pricePerUnit; msg.textContent=`Recording ${qty} ${sUnit} = ${money(amount)}...`;
    const {error:insErr}=await supa.from('sales').insert([{product_name:prod.name,quantity:qty,unit:sUnit,amount:amount,payment:pay,shop_id:currentShop.id}]);
    if(insErr){msg.textContent=insErr.message;msg.style.color="#b83232";return;}
    const newQty=prod.quantity-qtyToDeduct; const {error:upErr}=await supa.from('products').update({quantity:newQty}).eq('id',prodId);
    if(upErr){msg.textContent=upErr.message;return;} msg.textContent=`✅ ${qty} ${sUnit} = ${money(amount)} Saved! Shop #${currentShop.id}`; msg.style.color="#087443"; await loadAll();
  });}
  const debtForm=document.getElementById("debt-form"); if(debtForm){debtForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(debtForm); const name=String(fd.get("custName")||"").trim(); const phone=String(fd.get("custPhone")||"").trim(); const amount=Number(fd.get("custAmount")); const msg=document.getElementById("debt-msg"); if(!name||!amount){msg.textContent="Fill";return;} msg.textContent="Saving..."; const {error}=await supa.from('customers').insert([{name,phone,amount,shop_id:currentShop.id}]); if(error){msg.textContent=error.message;} else {msg.textContent="Saved Shop #"+currentShop.id; await loadAll();}});}
  const changeForm=document.getElementById("change-pass-form");
  if(changeForm){
    changeForm.addEventListener("submit",async e=>{
      e.preventDefault();
      const curr=document.getElementById("currPass").value; const newP=document.getElementById("newPass").value; const conf=document.getElementById("confirmPass").value;
      const msg=document.getElementById("changePassMsg");
      if(!curr||!newP||!conf){msg.textContent="Fill all"; msg.style.color="#b83232"; return;}
      if(newP!==conf){msg.textContent="❌ Don't match!"; msg.style.color="#b83232"; return;}
      if(newP.length<4){msg.textContent="Min 4 chars"; msg.style.color="#b83232"; return;}
      msg.textContent="Checking..."; msg.style.color="#718278";
      const {data,error}=await supa.from('shops').select('*').eq('id',currentShop.id).single();
      if(error){msg.textContent=error.message; msg.style.color="#b83232"; return;}
      if(data.password && data.password!==curr){msg.textContent="❌ Current wrong!"; msg.style.color="#b83232"; return;}
      const {error:upErr}=await supa.from('shops').update({password:newP}).eq('id',currentShop.id);
      if(upErr){msg.textContent=upErr.message; msg.style.color="#b83232"; return;}
      msg.textContent=`✅ Shop Password changed! New: ${newP} — Workers use this`; msg.style.color="#087443"; await renderShopList();
    });
  }
  const unlockBtn=document.getElementById("unlockProfitBtn");
  if(unlockBtn){
    unlockBtn.addEventListener("click",async()=>{
      const pinInput=document.getElementById("profitPinInput"); const msg=document.getElementById("pinMsg");
      const pin=pinInput?pinInput.value:''; if(!pin){msg.textContent='Enter Profit PIN'; return;}
      msg.textContent='Checking...';
      const {data,error}=await supa.from('shops').select('profit_pin').eq('id',currentShop.id).single();
      if(error){msg.textContent=error.message; return;}
      if((data.profit_pin||'')===pin){ sessionStorage.setItem(`profit_unlocked_${currentShop.id}`,'true'); render(); }
      else { msg.textContent='❌ Wrong Profit PIN! Only owner knows it.'; }
    });
  }
  const lockBtn=document.getElementById("lockProfitBtn");
  if(lockBtn){ lockBtn.addEventListener("click",()=>{ sessionStorage.removeItem(`profit_unlocked_${currentShop.id}`); render(); }); }
  const changeProfitForm=document.getElementById("change-profit-pin-form");
  if(changeProfitForm){
    changeProfitForm.addEventListener("submit",async e=>{
      e.preventDefault();
      const curr=document.getElementById("currProfitPin").value; const newPin=document.getElementById("newProfitPin").value; const conf=document.getElementById("confirmProfitPin").value;
      const msg=document.getElementById("changeProfitPinMsg");
      if(newPin!==conf){msg.textContent='❌ PINs dont match'; msg.style.color='#b83232'; return;}
      if(newPin.length<4){msg.textContent='Min 4 chars'; msg.style.color='#b83232'; return;}
      msg.textContent='Checking...'; msg.style.color='#718278';
      const {data}=await supa.from('shops').select('profit_pin').eq('id',currentShop.id).single();
      if(data && data.profit_pin && data.profit_pin!==curr){ msg.textContent='❌ Current Profit PIN wrong'; msg.style.color='#b83232'; return; }
      const {error}=await supa.from('shops').update({profit_pin:newPin}).eq('id',currentShop.id);
      if(error){msg.textContent=error.message; msg.style.color='#b83232';}
      else {msg.textContent=`✅ Profit PIN changed! New: ${newPin} — Keep secret from workers`; msg.style.color='#087443'; sessionStorage.setItem(`profit_unlocked_${currentShop.id}`,'true');}
    });
  }
}
