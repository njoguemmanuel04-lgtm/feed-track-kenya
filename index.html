<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087443">
<title>FeedTrack Kenya | Agrovet Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--green:#087443;--dark:#064e32;--light:#eaf7ef;--bg:#f4f8f6;--text:#17362a;--muted:#718278;--border:#e1ebe5;--white:#fff;--red:#b83232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,Helvetica,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.topbar{height:72px;padding:0 22px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:14px;background:var(--light);display:grid;place-items:center;font-size:25px}
.brand h1{margin:0;color:var(--dark);font-size:21px}.brand p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.shop-info{text-align:right;line-height:1.6}.shop-info strong{display:block}.shop-info span{color:var(--muted);font-size:12px}
.layout{display:flex;min-height:calc(100vh - 72px)}.sidebar{width:218px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:5px}
.nav-btn{width:100%;border:0;background:transparent;padding:13px 12px;border-radius:10px;text-align:left;color:#40594c;display:flex;gap:11px;align-items:center}
.nav-btn:hover,.nav-btn.active{background:var(--light);color:var(--green);font-weight:700}.nav-icon{width:22px;font-size:18px;text-align:center}
.sidebar-note{margin-top:auto;padding:14px;background:var(--light);border-radius:12px;line-height:1.6;font-size:12px}.sidebar-note strong{color:var(--dark)}
main{flex:1;min-width:0;padding:22px}.welcome{border-radius:16px;padding:25px;color:#fff;margin-bottom:20px;background:linear-gradient(110deg,#075b3a,#13834d);display:flex;align-items:center;justify-content:space-between;gap:16px;overflow:hidden}
.welcome h2{font-size:25px;margin:0 0 9px}.welcome p{margin:0;line-height:1.7;opacity:.92}.welcome-icon{font-size:52px}.demo{display:inline-block;margin-top:12px;padding:6px 9px;border:1px solid #ffffff70;border-radius:7px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:17px;min-width:0}
.stat-label{color:var(--muted);font-size:12px}.stat-icon{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:var(--light);margin-bottom:13px;font-size:19px}
.stat-value{font-size:clamp(17px,2vw,23px);font-weight:800;margin:8px 0;overflow-wrap:anywhere}.stat-foot{color:var(--muted);font-size:11px}
.content-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr);gap:16px;align-items:start}.stack{display:flex;flex-direction:column;gap:16px}
.card-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.card-heading h3{font-size:16px;margin:0}.subtext{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.6}
.text-btn{background:none;border:0;color:var(--green);font-weight:700;font-size:12px}.categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.category{border:1px solid var(--border);background:#fff;border-radius:10px;padding:13px 7px;text-align:center;color:var(--text)}.category:hover{border-color:var(--green);background:#f7fcf8}.category span{display:block;font-size:25px;margin-bottom:8px}.category strong{font-size:11px;display:block}.category small{display:block;color:var(--muted);margin-top:6px}
.quick-action{display:flex;width:100%;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff;text-align:left;margin-bottom:9px}.quick-action:last-child{margin-bottom:0}.quick-action:hover{background:var(--light)}
.action-icon{width:39px;height:39px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:var(--light);font-size:19px}.quick-action strong{display:block;margin-bottom:5px}.quick-action small{color:var(--muted)}
.alert{padding:11px 0;border-bottom:1px solid var(--border);display:flex;align-items:start;gap:9px;line-height:1.5}.alert:last-child{border-bottom:0}.alert-icon{color:var(--red);font-size:17px}.alert strong{display:block;font-size:12px}.alert small{color:var(--muted)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);font-size:12px}th{background:#f7faf8;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--light);color:var(--green);font-size:10px}.empty{color:var(--muted);text-align:center;padding:25px 8px;line-height:1.7}.primary{background:var(--green);color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700}.primary:hover{background:var(--dark)}.secondary{background:#fff;color:var(--green);border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-weight:700}
.page-title{margin:0 0 6px;font-size:24px}.page-description{color:var(--muted);margin:0 0 20px;line-height:1.6}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}.field{width:100%;border:1px solid #cfddd4;border-radius:8px;padding:11px;background:#fff;color:var(--text)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid label{display:block;font-size:12px;font-weight:700}.form-grid input,.form-grid select{display:block;margin-top:7px}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.notice{background:#fff7e8;color:#85530d;padding:12px;border-radius:9px;line-height:1.6;margin-bottom:15px;font-size:12px}.bar-chart{display:flex;align-items:end;gap:12px;height:145px;padding:12px 5px 0;border-bottom:1px solid var(--border)}.bar-item{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;min-width:0}.bar{width:min(36px,85%);border-radius:5px 5px 0 0;background:#15965b;min-height:5px}.bar-item small{font-size:10px;color:var(--muted)}
footer{padding:18px 22px;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}.mobile-nav{display:none}
@media (max-width:950px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:minmax(0,1fr)}.sidebar{width:190px}}
@media (max-width:650px){.topbar{height:64px;padding:0 13px}.brand h1{font-size:17px}.brand p{font-size:10px}.logo{width:36px;height:36px}.shop-info{display:none}.layout{display:block;min-height:calc(100vh - 64px)}.sidebar{display:none}main{padding:13px;padding-bottom:88px}.welcome{padding:20px 16px}.welcome h2{font-size:20px}.welcome p{font-size:12px}.welcome-icon{font-size:34px}.stats{gap:9px}.card{padding:13px}.stat-value{font-size:18px}.categories{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--border);justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:var(--muted);padding:5px 7px;font-size:10px;min-width:48px}.mobile-nav button span{display:block;font-size:19px;margin-bottom:3px}.mobile-nav button.active{color:var(--green);font-weight:700}.form-grid{grid-template-columns:minmax(0,1fr)}footer{padding:15px}.toolbar .field{min-width:100%!important}.toolbar button{width:100%}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">🌿</div><div><h1>FeedTrack Kenya</h1><p>Agrovet & Farm Supplies Management</p></div></div><div class="shop-info"><strong>My Agrovet</strong><span>Live: torzbgvwjhthzuifdses</span></div></header>
<div class="layout"><aside class="sidebar"><nav id="side-nav"></nav><div class="sidebar-note"><strong>🌱 Grow your business</strong><br>Manage your agrovet from one dashboard.</div></aside><main id="main-content"></main></div><nav class="mobile-nav" id="mobile-nav"></nav>
<footer><span><strong>FeedTrack Kenya</strong> · Agrovet Management</span><span>LIVE Supabase torzbgvwjhthzuifdses</span></footer>
<script>
"use strict";
const SUPABASE_URL="https://torzbgvwjhthzuifdses.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnpiZ3Z3amh0aHp1aWZkc2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODQ4OTAsImV4cCI6MjEwODg2MDg5MH0.Jjzgt-mCxA94Y1lG6fLDLupteE8RZs6dygJO5BVClKY";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let demoProducts=[], demoSales=[], demoDebts=[];
const categories=[["Animal Feeds","🌾"],["Seeds","🌱"],["Fertilizers","🪴"],["Pesticides","🧴"],["Veterinary Products","🐄"],["Farming Equipment","🛠️"]];
const navItems=[["Dashboard","⌂"],["Products","▦"],["Stock","📦"],["Sales","🛒"],["Customers / Debts","👥"],["Suppliers","🚚"],["Expenses","💳"],["Reports","▤"],["Staff","♙"],["Settings","⚙"]];
let currentPage="Dashboard",productFilter="",searchTerm="";
const money=a=>"KSh "+Number(a).toLocaleString("en-KE",{maximumFractionDigits:2});
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function loadAll(){
  const p=await supa.from('products').select('*').order('created_at',{ascending:false}).limit(200);
  if(!p.error&&p.data) demoProducts=p.data.map(d=>({id:d.id,name:d.name,category:d.category,quantity:Number(d.quantity),unit:d.unit,cost:Number(d.cost),price:Number(d.price)}));
  const s=await supa.from('sales').select('*').order('created_at',{ascending:false}).limit(200);
  if(!s.error&&s.data) demoSales=s.data.map(r=>({id:r.id,date:new Date(r.created_at).toLocaleDateString(),product:r.product_name,quantity:Number(r.quantity),unit:r.unit,amount:Number(r.amount),payment:r.payment}));
  const c=await supa.from('customers').select('*').order('created_at',{ascending:false}).limit(200);
  if(!c.error&&c.data) demoDebts=c.data.map(r=>({id:r.id,customer:r.name,phone:r.phone,amount:Number(r.amount)}));
  render();
}
function renderNavigation(){
  const makeButtons=mobile=>navItems.map(([name,icon])=>{
    if(mobile&&!["Dashboard","Products","Sales","Customers / Debts","Settings"].includes(name)) return "";
    const label=name==="Customers / Debts"?"Debts":name;
    if(mobile){return `<button class="mobile-btn ${currentPage===name?"active":""}" data-page="${name}" type="button"><span>${icon}</span>${label}</button>`;}
    return `<button class="nav-btn ${currentPage===name?"active":""}" data-page="${name}" type="button"><span class="nav-icon">${icon}</span><span>${name}</span></button>`;
  }).join("");
  document.getElementById("side-nav").innerHTML=makeButtons(false);
  document.getElementById("mobile-nav").innerHTML=makeButtons(true);
  document.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;searchTerm="";productFilter="";render();window.scrollTo({top:0,behavior:"smooth"})})});
}
function card(title,content){return `<section class="card"><div class="card-heading"><h3>${title}</h3></div>${content}</section>`;}
function renderDashboard(){
  const stockValue=demoProducts.reduce((s,p)=>s+p.quantity*p.cost,0);
  const todaySales=demoSales.reduce((s,x)=>s+x.amount,0);
  const debts=demoDebts.reduce((s,d)=>s+d.amount,0);
  const lowStock=demoProducts.filter(p=>p.quantity<=5);
  return `<section class="welcome"><div><h2>Welcome to FeedTrack Kenya 🌿</h2><p>Your agrovet, your stock, your business — managed in one place.</p><span class="demo">LIVE · torzbgvwjhthzuifdses — ${demoProducts.length} products, ${demoSales.length} sales</span></div><div class="welcome-icon">🌾🐄</div></section>
  <div class="stats">
    <section class="card"><div class="stat-icon">📦</div><div class="stat-label">Stock purchase value</div><div class="stat-value">${money(stockValue)}</div><div class="stat-foot">${demoProducts.length} live products</div></section>
    <section class="card"><div class="stat-icon">🛒</div><div class="stat-label">Total sales (live)</div><div class="stat-value">${money(todaySales)}</div><div class="stat-foot">${demoSales.length} transactions</div></section>
    <section class="card"><div class="stat-icon">💰</div><div class="stat-label">Outstanding debts</div><div class="stat-value">${money(debts)}</div><div class="stat-foot">${demoDebts.length} customers</div></section>
    <section class="card"><div class="stat-icon">⚠️</div><div class="stat-label">Low-stock products</div><div class="stat-value">${lowStock.length}</div><div class="stat-foot">Needs reorder</div></section>
  </div>
  <div class="content-grid"><div class="stack">
    ${card("Product categories",`<div class="categories">${categories.map(([name,icon])=>`<button class="category" data-category="${escapeHTML(name)}" type="button"><span>${icon}</span><strong>${escapeHTML(name)}</strong><small>${demoProducts.filter(p=>p.category===name).length} products</small></button>`).join("")}</div>`)}
    ${card("Recent live sales",`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Payment</th></tr></thead><tbody>${demoSales.slice(0,5).map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(s.product)}</td><td>${s.quantity} ${escapeHTML(s.unit)}</td><td>${money(s.amount)}</td><td><span class="pill">${escapeHTML(s.payment)}</span></td></tr>`).join("")||`<tr><td colspan="5">No sales yet. Record one in Sales tab.</td></tr>`}</tbody></table></div>`)}
  </div>
  <div class="stack">
    ${card("Quick actions",[["🛒","Record a sale","Sell & reduce stock","Sales"],["📦","Manage products","Add or browse stock","Products"],["👥","Customer debts","Add customer credit","Customers / Debts"],["📊","View reports","Business reports","Reports"]].map(([icon,title,desc,page])=>`<button class="quick-action" data-page="${page}" type="button"><span class="action-icon">${icon}</span><span><strong>${title}</strong><small>${desc}</small></span></button>`).join(""))}
    ${card("Low-stock alerts",lowStock.map(p=>`<div class="alert"><span class="alert-icon">⚠</span><div><strong>${escapeHTML(p.name)}</strong><small>Only ${p.quantity} ${escapeHTML(p.unit)} left</small></div></div>`).join("")||`<div class="empty">No low-stock items.</div>`)}
  </div></div>`;
}
function renderProducts(){
  const filtered=demoProducts.filter(p=>(!productFilter||p.category===productFilter)&&p.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return `<h2 class="page-title">Products & Stock</h2><p class="page-description">Live inventory — saves to Supabase torzbgvwjhthzuifdses.</p><div class="notice">LIVE: Products save to Supabase and stay after refresh.</div><div class="toolbar"><input class="field" id="product-search" placeholder="Search products..." value="${escapeHTML(searchTerm)}" style="flex:1;min-width:150px"><select class="field" id="category-filter" style="flex:1;min-width:150px"><option value="">All categories</option>${categories.map(([n])=>`<option value="${escapeHTML(n)}" ${productFilter===n?"selected":""}>${escapeHTML(n)}</option>`).join("")}</select><button class="primary" id="add-product-btn" type="button">＋ Add Product</button><button class="secondary" data-page="Stock" type="button">Stock overview</button></div><section class="card" id="add-product-panel" hidden><div class="card-heading"><h3>Add a new product</h3><button class="text-btn" id="cancel-product-btn" type="button">Cancel</button></div><form id="add-product-form"><div class="form-grid"><label>Product name *<input class="field" name="productName" required></label><label>Category *<select class="field" name="category" required><option value="">Choose</option>${categories.map(([n])=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("")}</select></label><label>Quantity *<input class="field" name="quantity" type="number" min="0" step="any" required></label><label>Unit *<select class="field" name="unit" required><option value="">Choose</option><option value="bags">Bags</option><option value="kg">kg</option><option value="packets">Packets</option><option value="bottles">Bottles</option><option value="pieces">Pieces</option><option value="litres">Litres</option><option value="boxes">Boxes</option><option value="other">Other</option></select></label><label>Cost KSh *<input class="field" name="cost" type="number" min="0" step="0.01" required></label><label>Price KSh *<input class="field" name="price" type="number" min="0" step="0.01" required></label></div><div class="form-actions"><button class="primary" type="submit">Save Live</button><button class="secondary" id="cancel-product-btn-2" type="button">Cancel</button></div><p id="product-form-message"></p></form></section><section class="card"><div class="card-heading"><h3>Inventory</h3><span class="pill">${filtered.length} products</span></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Qty</th><th>Cost</th><th>Selling</th><th>Margin</th><th>Value</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><strong>${escapeHTML(p.name)}</strong></td><td>${escapeHTML(p.category)}</td><td><span class="pill" style="${p.quantity<=5?"background:#fff0ed;color:#b83232":""}">${p.quantity} ${escapeHTML(p.unit)}</span></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.price-p.cost)}</td><td>${money(p.quantity*p.cost)}</td></tr>`).join("")||`<tr><td colspan="7">No products found.</td></tr>`}</tbody></table></div></section>`;
}
function renderSales(){
  return `<h2 class="page-title">Sales — LIVE</h2><p class="page-description">Record a sale — stock will reduce automatically.</p><div class="notice">LIVE MODE: Sales save to Supabase table <b>sales</b> and reduce stock.</div><section class="card"><div class="card-heading"><h3>Record New Sale</h3></div><form id="sale-form"><div class="form-grid"><label>Product *<select class="field" name="saleProduct" required><option value="">Choose product</option>${demoProducts.map(p=>`<option value="${p.id}">${escapeHTML(p.name)} — ${p.quantity} ${escapeHTML(p.unit)} left @ ${money(p.price)}</option>`).join("")}</select></label><label>Quantity *<input class="field" name="saleQty" type="number" min="0.1" step="any" required></label><label>Payment *<select class="field" name="salePay" required><option value="M-PESA">M-PESA</option><option value="Cash">Cash</option><option value="Credit">Credit / Debt</option><option value="Bank">Bank</option></select></label><label>Customer (for credit)<input class="field" name="saleCustomer" placeholder="Optional"></label></div><div class="form-actions"><button class="primary" type="submit">Record Sale Live</button></div><p id="sale-msg"></p></form></section><section class="card"><div class="card-heading"><h3>All Live Sales</h3><span class="pill">${demoSales.length} sales</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Payment</th></tr></thead><tbody>${demoSales.map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(s.product)}</td><td>${s.quantity} ${escapeHTML(s.unit)}</td><td>${money(s.amount)}</td><td><span class="pill">${escapeHTML(s.payment)}</span></td></tr>`).join("")||`<tr><td colspan="5">No sales yet.</td></tr>`}</tbody></table></div></section>`;
}
function renderDebts(){
  return `<h2 class="page-title">Customers & Debts — LIVE</h2><p class="page-description">Add customers who buy on credit.</p><section class="card"><div class="card-heading"><h3>Add Customer Debt</h3></div><form id="debt-form"><div class="form-grid"><label>Customer Name *<input class="field" name="custName" required></label><label>Phone<input class="field" name="custPhone"></label><label>Amount Owed KSh *<input class="field" name="custAmount" type="number" min="0" step="0.01" required></label><label></label></div><div class="form-actions"><button class="primary" type="submit">Save Debt Live</button></div><p id="debt-msg"></p></form></section><section class="card"><div class="card-heading"><h3>Outstanding Balances</h3><span class="pill">${money(demoDebts.reduce((s,d)=>s+d.amount,0))}</span></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Phone</th><th>Balance</th><th>Status</th></tr></thead><tbody>${demoDebts.map(d=>`<tr><td><strong>${escapeHTML(d.customer)}</strong></td><td>${escapeHTML(d.phone||"")}</td><td>${money(d.amount)}</td><td><span class="pill">Owes</span></td></tr>`).join("")||`<tr><td colspan="4">No debts.</td></tr>`}</tbody></table></div></section>`;
}
function renderStock(){const low=demoProducts.filter(p=>p.quantity<=5);return `<h2 class="page-title">Stock overview</h2><p class="page-description">Live stock from Supabase.</p>${card("Low-stock items",low.map(p=>`<div class="alert"><span class="alert-icon">⚠</span><div><strong>${escapeHTML(p.name)}</strong><small>${p.quantity} ${escapeHTML(p.unit)} remaining</small></div></div>`).join("")||`<div class="empty">No low-stock.</div>`)}<br>${card("All stock",`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Value</th></tr></thead><tbody>${demoProducts.map(p=>`<tr><td>${escapeHTML(p.name)}</td><td>${p.quantity} ${escapeHTML(p.unit)}</td><td>${money(p.quantity*p.cost)}</td></tr>`).join("")}</tbody></table></div>`)}`;}
function renderBasicPage(t,d){return `<h2 class="page-title">${t}</h2><p class="page-description">${d}</p><section class="card"><div class="empty"><div style="font-size:35px">🌱</div><strong>Planned for next stage.</strong><br>Project torzbgvwjhthzuifdses is LIVE.</div></section>`;}
function render(){
  renderNavigation();
  const content=document.getElementById("main-content");
  const pages={"Dashboard":renderDashboard,"Products":renderProducts,"Stock":renderStock,"Sales":renderSales,"Customers / Debts":renderDebts,"Suppliers":()=>renderBasicPage("Suppliers","Suppliers module."),"Expenses":()=>renderBasicPage("Expenses","Expenses module."),"Reports":()=>renderBasicPage("Reports","Reports module."),"Staff":()=>renderBasicPage("Staff","Staff module."),"Settings":()=>renderBasicPage("Settings","Settings module.")};
  content.innerHTML=(pages[currentPage]||renderDashboard)();
  content.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;searchTerm="";productFilter="";render()})});
  content.querySelectorAll("[data-category]").forEach(b=>{b.addEventListener("click",()=>{currentPage="Products";productFilter=b.dataset.category;searchTerm="";render()})});
  const addButton=document.getElementById("add-product-btn"); const panel=document.getElementById("add-product-panel"); const form=document.getElementById("add-product-form");
  function closeForm(){if(panel) panel.hidden=true; if(form) form.reset();}
  if(addButton){addButton.addEventListener("click",()=>{panel.hidden=false; panel.scrollIntoView({behavior:"smooth"})})}
  ["cancel-product-btn","cancel-product-btn-2"].forEach(id=>{const b=document.getElementById(id); if(b) b.addEventListener("click",closeForm)});
  if(form){form.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(form); const name=String(fd.get("productName")||"").trim(); const category=String(fd.get("category")||""); const unit=String(fd.get("unit")||""); const quantity=Number(fd.get("quantity")); const cost=Number(fd.get("cost")); const price=Number(fd.get("price")); const msg=document.getElementById("product-form-message"); if(!name||!category||!unit){msg.textContent="Fill all"; return;} msg.textContent="Saving..."; const {error}=await supa.from('products').insert([{name,category,quantity,unit,cost,price}]); if(error) msg.textContent=error.message; else {await loadAll();}});}
  const search=document.getElementById("product-search"); if(search){search.addEventListener("input",ev=>{searchTerm=ev.target.value; const pos=ev.target.selectionStart; render(); const nxt=document.getElementById("product-search"); if(nxt){nxt.focus(); nxt.setSelectionRange(pos,pos)}})}
  const filter=document.getElementById("category-filter"); if(filter){filter.addEventListener("change",ev=>{productFilter=ev.target.value; render()})}
  const saleForm=document.getElementById("sale-form");
  if(saleForm){saleForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(saleForm); const prodId=Number(fd.get("saleProduct")); const qty=Number(fd.get("saleQty")); const pay=String(fd.get("salePay")); const msg=document.getElementById("sale-msg"); const prod=demoProducts.find(p=>p.id===prodId); if(!prod){msg.textContent="Choose product";return;} if(qty>prod.quantity){msg.textContent=`Only ${prod.quantity} ${prod.unit} left!`;msg.style.color="#b83232";return;} const amount=qty*prod.price; msg.textContent="Recording..."; const {error:insErr}=await supa.from('sales').insert([{product_name:prod.name,quantity:qty,unit:prod.unit,amount:amount,payment:pay}]); if(insErr){msg.textContent=insErr.message;msg.style.color="#b83232";return;} const newQty=prod.quantity-qty; const {error:upErr}=await supa.from('products').update({quantity:newQty}).eq('id',prodId); if(upErr){msg.textContent=upErr.message;return;} msg.textContent=`Sale saved! ${prod.name} ${qty}${prod.unit} = ${money(amount)}. Stock now ${newQty}`; msg.style.color="#087443"; await loadAll();});}
  const debtForm=document.getElementById("debt-form");
  if(debtForm){debtForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(debtForm); const name=String(fd.get("custName")||"").trim(); const phone=String(fd.get("custPhone")||"").trim(); const amount=Number(fd.get("custAmount")); const msg=document.getElementById("debt-msg"); if(!name||!amount){msg.textContent="Fill name and amount";return;} msg.textContent="Saving..."; const {error}=await supa.from('customers').insert([{name,phone,amount}]); if(error){msg.textContent=error.message;msg.style.color="#b83232";} else {msg.textContent="Debt saved LIVE";msg.style.color="#087443"; await loadAll();}});}
}
loadAll();
</script>
</body>
</html>
