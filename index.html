<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Farmgate Feeds - Mwea | Full + Admin Button FREE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>:root{--green:#087443;--dark:#064e32;--light:#eaf7ef;--bg:#f4f8f6;--text:#17362a;--muted:#718278;--border:#e1ebe5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:72px;padding:0 22px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{width:43px;height:43px;border-radius:14px;background:var(--light);display:grid;place-items:center;font-size:25px}.layout{display:flex;min-height:calc(100vh - 72px)}.sidebar{width:218px;background:#fff;border-right:1px solid var(--border);padding:20px 12px}.nav-btn{width:100%;border:0;background:transparent;padding:13px 12px;border-radius:10px;text-align:left;display:flex;gap:11px}.nav-btn.active{background:var(--light);color:var(--green);font-weight:700}main{flex:1;padding:22px}.welcome{border-radius:16px;padding:25px;color:#fff;margin-bottom:20px;background:linear-gradient(110deg,#075b3a,#13834d);display:flex;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:17px;margin-bottom:16px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}th{background:#f7faf8}.field{width:100%;border:1px solid #cfddd4;border-radius:8px;padding:11px;background:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid label{font-size:12px;font-weight:700}.primary{background:var(--green);color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700}.secondary{background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px 13px}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--light);color:var(--green);font-size:10px}.empty{color:var(--muted);text-align:center;padding:20px}.notice{background:#fff7e8;color:#85530d;padding:12px;border-radius:9px;margin-bottom:15px;font-size:12px}.mobile-nav{display:none}
#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#064e32,#13834d);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{background:#fff;border-radius:16px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.2);max-height:95vh;overflow:auto}
.shopList{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:15px}
.shopItem{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.shopItem:hover{background:var(--light)} .shopItem:last-child{border:0}
.passRow{display:flex;gap:8px;margin-top:8px;align-items:center}
.passInputWrap{position:relative;flex:1;display:flex;align-items:center}
.passInputWrap .field{padding-right:40px}
.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:18px;cursor:pointer;padding:6px;border-radius:6px}
.eyeBtn:hover{background:#eaf7ef}
@media(max-width:650px){.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);justify-content:space-around;padding:7px}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px}.mobile-nav button.active{color:var(--green)}.form-grid{grid-template-columns:1fr}main{padding-bottom:80px}}</style></head><body>
<div id="loginOverlay">
  <div class="loginBox">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><div style="width:48px;height:48px;background:var(--light);border-radius:12px;display:grid;place-items:center;font-size:26px">🌿</div><div><h2>Farmgate Feeds</h2><p style="margin:0;font-size:12px;color:#718278">FeedTrack Kenya - Protected</p></div></div>
    <div id="shopList" class="shopList"><div style="padding:12px;color:var(--muted)">Loading shops...</div></div>
    <div id="passSection" style="display:none;background:var(--light);padding:12px;border-radius:10px;margin-bottom:15px">
      <strong id="passShopName" style="font-size:13px"></strong>
      <div class="passRow">
        <div class="passInputWrap">
          <input class="field" id="enterPass" type="password" placeholder="Enter shop password">
          <button class="eyeBtn" type="button" data-target="enterPass">👁️</button>
        </div>
        <button class="primary" id="confirmEnter" type="button">Enter</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="secondary" id="cancelPass" type="button" style="font-size:11px">Cancel</button><span id="passMsg" style="font-size:12px;color:#b83232;font-weight:700"></span></div>
    </div>
    <h3 style="margin:14px 0 8px;font-size:13px">Create New Shop (with eye)</h3>
    <div class="form-grid" style="grid-template-columns:1fr">
      <label>Shop Name *<input class="field" id="newShopName" placeholder="e.g. Wanguru Agrovet"></label>
      <label>Phone *<input class="field" id="newShopPhone" placeholder="07..."></label>
      <label>Location<input class="field" id="newShopLocation" placeholder="Mwea, Wanguru"></label>
      <label>Shop Password * (eye icon)
        <div class="passInputWrap">
          <input class="field" id="newShopPass" type="password" placeholder="e.g. Farmgate2025!">
          <button class="eyeBtn" type="button" data-target="newShopPass">👁️</button>
        </div>
      </label>
    </div>
    <button class="primary" id="createShopBtn" style="width:100%;margin-top:12px" type="button">+ Create Shop & Enter</button>
    <p id="loginMsg" style="font-size:12px;margin-top:10px;color:#b83232"></p>
  </div>
</div>
<header class="topbar"><div class="brand"><div class="logo">🌿</div><div><h1 id="headerShopName">Farmgate Feeds</h1><p style="font-size:11px;color:var(--muted);margin:0" id="headerSub">Shop loading...</p></div></div><div style="text-align:right"><strong id="headerShopShort">Mwea</strong><br><button class="secondary" id="logoutBtn" style="padding:4px 10px;font-size:11px;margin-top:4px">Logout / Switch Shop</button><br><span style="color:var(--muted);font-size:11px" id="liveStatus">LIVE Supabase</span></div></header>
<div class="layout"><aside class="sidebar"><nav id="side-nav"></nav></aside><main id="main-content"></main></div><nav class="mobile-nav" id="mobile-nav"></nav>
<script>
"use strict";
const SUPABASE_URL="https://torzbgvwjhthzuifdses.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnpiZ3Z3amh0aHp1aWZkc2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODQ4OTAsImV4cCI6MjEwODg2MDg5MH0.Jjzgt-mCxA94Y1lG6fLDLupteE8RZs6dygJO5BVClKY";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let demoProducts=[], demoSales=[], demoDebts=[];
let currentShop = null;
let selectedShopToEnter = null;
const categories=[["Animal Feeds","🌾"],["Seeds","🌱"],["Fertilizers","🪴"],["Pesticides","🧴"],["Veterinary Products","🐄"],["Farming Equipment","🛠️"]];
const navItems=[["Dashboard","⌂"],["Products","▦"],["Stock","📦"],["Sales","🛒"],["Customers / Debts","👥"],["Suppliers","🚚"],["Expenses","💳"],["Reports","▤"],["Staff","♙"],["Settings","⚙"]];
let currentPage="Dashboard",productFilter="",searchTerm="";
const money=a=>"KSh "+Number(a).toLocaleString("en-KE",{maximumFractionDigits:2});
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toggleEye(btn){const id=btn.dataset.target;const input=document.getElementById(id);if(!input) return;if(input.type==='password'){input.type='text';btn.textContent='🙈';} else {input.type='password';btn.textContent='👁️';}}
document.addEventListener('click',e=>{if(e.target.classList.contains('eyeBtn')) toggleEye(e.target);});
async function fetchShops(){
  const {data,error}=await supa.from('shops').select('*').order('created_at',{ascending:true}).limit(100);
  if(error){document.getElementById('shopList').innerHTML=`<div style="padding:12px;color:#b83232">${escapeHTML(error.message)}</div>`;return [];}
  return data||[];
}
async function renderShopList(){
  const shops=await fetchShops();
  const list=document.getElementById('shopList');
  if(!shops.length){list.innerHTML='<div style="padding:12px;color:var(--muted)">No shops yet. Create Farmgate first.</div>';return;}
  list.innerHTML=shops.map(s=>{
    const hasPass=s.password?'🔒':'🔓';
    const isDeactivated=s.is_active===false;
    const style=isDeactivated?'opacity:0.6;background:#fff0ed;border-left:4px solid #b83232':'';
    return `<div class="shopItem" data-id="${s.id}" data-name="${escapeHTML(s.shop_name)}" data-loc="${escapeHTML(s.location||'')}" data-pass="${escapeHTML(s.password||'')}" data-active="${s.is_active!==false}" style="${style}"><span><strong>${hasPass} ${escapeHTML(s.shop_name)} ${isDeactivated?'⛔':''}</strong><br><small style="color:${isDeactivated?'#b83232':'var(--muted)'}">${escapeHTML(s.location||'')} • ${escapeHTML(s.phone||'')} ${isDeactivated?'⛔ DEACTIVATED':''}</small></span><span style="color:${isDeactivated?'#b83232':'var(--green)'};font-weight:700">${isDeactivated?'BLOCKED':'Enter →'}</span></div>`;
  }).join('');
  list.querySelectorAll('.shopItem').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.active==='false'){alert('⛔ SHOP DEACTIVATED! Contact Farmgate Owner. Till: 0116982197');return;}
      const shop={id:Number(el.dataset.id), name:el.dataset.name, loc:el.dataset.loc, pass:el.dataset.pass};
      selectedShopToEnter=shop;
      document.getElementById('passShopName').textContent=`Enter password for ${shop.name}`;
      document.getElementById('passSection').style.display='block';
      document.getElementById('enterPass').value='';
      document.getElementById('enterPass').type='password';
      const eye=document.querySelector('[data-target="enterPass"]'); if(eye) eye.textContent='👁️';
      document.getElementById('passMsg').textContent='';
      document.getElementById('enterPass').focus();
    });
  });
}
function getSavedShop(){try{return JSON.parse(localStorage.getItem('farmgate_current_shop')||'null')}catch{return null}}
function saveShop(shop){localStorage.setItem('farmgate_current_shop',JSON.stringify(shop))}
async function loginToShop(id,name,loc){
  const shop={id,name,location:loc};
  currentShop=shop; saveShop(shop);
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('passSection').style.display='none';
  document.getElementById('headerShopName').textContent=name;
  document.getElementById('headerShopShort').textContent=(loc||name).split(' ')[0];
  document.getElementById('headerSub').textContent=`Shop #${id} • ${loc||'Mwea'} • LOCKED • LIVE`;
  await loadAll();
}
async function tryEnterWithPassword(){
  if(!selectedShopToEnter) return;
  const entered=document.getElementById('enterPass').value;
  const msg=document.getElementById('passMsg');
  if(!entered){msg.textContent='Enter password';return;}
  const {data: freshShop} = await supa.from('shops').select('*').eq('id', selectedShopToEnter.id).single();
  if(freshShop && freshShop.is_active === false){
    msg.textContent='⛔ SHOP DEACTIVATED! Contact Owner. Pay Till 0116982197';
    return;
  }
  if(!selectedShopToEnter.pass){
    if(confirm(`Shop ${selectedShopToEnter.name} has NO password. Enter?`)){
      await loginToShop(selectedShopToEnter.id,selectedShopToEnter.name,selectedShopToEnter.loc);
    }
    return;
  }
  if(entered===selectedShopToEnter.pass){
    await loginToShop(selectedShopToEnter.id,selectedShopToEnter.name,selectedShopToEnter.loc);
  }else{
    msg.textContent='❌ Wrong password!';
  }
}
async function initLogin(){
  const saved=getSavedShop();
  await renderShopList();
  if(saved && saved.id){
    const {data}=await supa.from('shops').select('*').eq('id',saved.id).maybeSingle();
    if(data){ 
      if(data.is_active===false){
        localStorage.removeItem('farmgate_current_shop');
        alert('⛔ Your shop was DEACTIVATED. Contact owner.');
        document.getElementById('loginOverlay').style.display='flex';
        return;
      }
      await loginToShop(data.id,data.shop_name,data.location); return; 
    }
  }
  document.getElementById('loginOverlay').style.display='flex';
}
async function createShop(){
  const nameEl=document.getElementById('newShopName'); const phoneEl=document.getElementById('newShopPhone'); const locEl=document.getElementById('newShopLocation'); const passEl=document.getElementById('newShopPass'); const msg=document.getElementById('loginMsg');
  const shop_name=(nameEl.value||'').trim(); const phone=(phoneEl.value||'').trim(); const location=(locEl.value||'Mwea').trim()||'Mwea'; const password=(passEl.value||'').trim();
  if(!shop_name){msg.textContent='Shop name required';return;}
  if(!phone){msg.textContent='Phone required';return;}
  if(!password){msg.textContent='Password required! Use eye icon';return;}
  if(password.length<4){msg.textContent='Min 4 chars';return;}
  msg.style.color='#718278'; msg.textContent='Creating...';
  const {data,error}=await supa.from('shops').insert([{shop_name,phone,location,password,is_active:true}]).select().single();
  if(error){ msg.style.color='#b83232'; msg.textContent=error.message; return; }
  msg.style.color='#087443'; msg.textContent='Created!';
  await loginToShop(data.id,data.shop_name,data.location);
  await renderShopList();
}
document.getElementById('logoutBtn').addEventListener('click',()=>{localStorage.removeItem('farmgate_current_shop'); currentShop=null; demoProducts=[]; demoSales=[]; demoDebts=[]; document.getElementById('loginOverlay').style.display='flex'; document.getElementById('passSection').style.display='none'; renderShopList();});
document.getElementById('createShopBtn').addEventListener('click',createShop);
document.getElementById('confirmEnter').addEventListener('click',tryEnterWithPassword);
document.getElementById('cancelPass').addEventListener('click',()=>{document.getElementById('passSection').style.display='none'; selectedShopToEnter=null;});
document.getElementById('enterPass').addEventListener('keydown',e=>{if(e.key==='Enter') tryEnterWithPassword();});

async function loadAll(){
  if(!currentShop) return;
  const shopId=currentShop.id;
  const p=await supa.from('products').select('*').eq('shop_id',shopId).order('created_at',{ascending:false}).limit(200);
  if(!p.error&&p.data) demoProducts=p.data.map(d=>({id:d.id,name:d.name,category:d.category,quantity:Number(d.quantity),unit:d.unit,bag_weight:d.bag_weight?Number(d.bag_weight):(d.unit==='bags'?50:1),cost:Number(d.cost),price:Number(d.price)}));
  const s=await supa.from('sales').select('*').eq('shop_id',shopId).order('created_at',{ascending:false}).limit(200);
  if(!s.error&&s.data) demoSales=s.data.map(r=>({id:r.id,date:new Date(r.created_at).toLocaleDateString(),product:r.product_name,quantity:Number(r.quantity),unit:r.unit,amount:Number(r.amount),payment:r.payment}));
  const c=await supa.from('customers').select('*').eq('shop_id',shopId).order('created_at',{ascending:false}).limit(200);
  if(!c.error&&c.data) demoDebts=c.data.map(r=>({id:r.id,customer:r.name,phone:r.phone,amount:Number(r.amount)}));
  document.getElementById('liveStatus').textContent=`LIVE • Shop #${shopId} • ${demoProducts.length} products`;
  render();
}
function renderNavigation(){
  const makeButtons=mobile=>navItems.map(([name,icon])=>{
    if(mobile&&!["Dashboard","Products","Sales","Customers / Debts","Settings"].includes(name)) return "";
    const label=name==="Customers / Debts"?"Debts":name;
    if(mobile){return `<button class="${currentPage===name?"active":""}" data-page="${name}" type="button"><span>${icon}</span><br>${label}</button>`;}
    return `<button class="nav-btn ${currentPage===name?"active":""}" data-page="${name}" type="button"><span>${icon}</span><span>${name}</span></button>`;
  }).join("");
  document.getElementById("side-nav").innerHTML=makeButtons(false);
  document.getElementById("mobile-nav").innerHTML=makeButtons(true);
  document.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;searchTerm="";productFilter="";render();window.scrollTo({top:0})})});
}
function card(title,content){return `<section class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">${title}</h3></div>${content}</section>`;}
function renderDashboard(){
  return `<section class="welcome"><div><h2>Welcome to ${escapeHTML(currentShop?currentShop.name:'Farmgate')} 🔒</h2><p>Shop #${currentShop?currentShop.id:'-'} locked. Bags 20-100kg. Admin included FREE.</p><span style="display:inline-block;margin-top:10px;padding:5px 8px;border:1px solid #ffffff70;border-radius:7px;font-size:11px">LOCKED · ${demoProducts.length} products • Eye icon • Deactivate works</span></div><div style="font-size:50px">🔒🌾</div></section>
  <div class="stats">
    <section class="card"><div>📦 Stock Value</div><div style="font-size:20px;font-weight:800;margin:8px 0">${money(demoProducts.reduce((s,p)=>s+p.quantity*p.cost,0))}</div><div style="color:var(--muted);font-size:11px">${demoProducts.length} live</div></section>
    <section class="card"><div>🛒 Sales</div><div style="font-size:20px;font-weight:800;margin:8px 0">${money(demoSales.reduce((s,x)=>s+x.amount,0))}</div><div style="color:var(--muted);font-size:11px">${demoSales.length} trans</div></section>
    <section class="card"><div>💰 Debts</div><div style="font-size:20px;font-weight:800;margin:8px 0">${money(demoDebts.reduce((s,d)=>s+d.amount,0))}</div><div style="color:var(--muted);font-size:11px">${demoDebts.length} customers</div></section>
    <section class="card"><div>⚠️ Low Stock</div><div style="font-size:20px;font-weight:800;margin:8px 0">${demoProducts.filter(p=>p.quantity<=5).length}</div><div style="color:var(--muted);font-size:11px">Needs reorder</div></section>
  </div>
  ${card("Recent live sales",`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Pay</th></tr></thead><tbody>${demoSales.slice(0,5).map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(s.product)}</td><td>${s.quantity} ${escapeHTML(s.unit)}</td><td>${money(s.amount)}</td><td><span class="pill">${escapeHTML(s.payment)}</span></td></tr>`).join("")||`<tr><td colspan="5">No sales</td></tr>`}</tbody></table></div>`)}`;
}
function renderProducts(){
  const filtered=demoProducts.filter(p=>(!productFilter||p.category===productFilter)&&p.name.toLowerCase().includes(searchTerm.toLowerCase()));
  return `<h2>Products — ${escapeHTML(currentShop?currentShop.name:'')} 🔒</h2><div class="notice">Locked to Shop #${currentShop?currentShop.id:''} • Deactivate blocks login</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><input class="field" id="product-search" placeholder="Search..." value="${escapeHTML(searchTerm)}" style="flex:1;min-width:150px"><select class="field" id="category-filter" style="min-width:140px"><option value="">All</option>${categories.map(([n])=>`<option value="${escapeHTML(n)}" ${productFilter===n?"selected":""}>${escapeHTML(n)}</option>`).join("")}</select><button class="primary" id="add-product-btn" type="button">＋ Add Product</button><button class="secondary" id="seed-btn" type="button">Seed 15 Demo</button></div>
  <section class="card" id="add-product-panel" hidden><h3>Add Product — FREE TYPE</h3><form id="add-product-form"><div class="form-grid">
  <label>Product name * (FREE TYPE)<input class="field" name="productName" required placeholder="Layers, Omena, Black Gold..."></label>
  <label>Category *<select class="field" name="category" required><option value="">Choose</option>${categories.map(([n])=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("")}</select></label>
  <label>Quantity *<input class="field" name="quantity" type="number" min="0" step="any" required></label>
  <label>Store Unit *<select class="field" name="unit" id="unitSelect" required><option value="bags">Bags</option><option value="kg">Kg (loose)</option><option value="packets">Packets</option><option value="bottles">Bottles</option><option value="pieces">Pieces</option></select></label>
  <label id="bagWeightLabel">Bag Weight (kg) *<select class="field" name="bag_weight" id="bagWeightSelect" required><option value="20">20 kg</option><option value="25">25 kg</option><option value="30">30 kg</option><option value="40">40 kg</option><option value="50" selected>50 kg</option><option value="70">70 kg</option><option value="90">90 kg</option><option value="100">100 kg</option></select></label>
  <label>Cost KSh *<input class="field" name="cost" type="number" min="0" step="0.01" required></label>
  <label>Price KSh *<input class="field" name="price" type="number" min="0" step="0.01" required></label>
  </div><div style="margin-top:12px;display:flex;gap:8px"><button class="primary" type="submit">Save Live</button><button class="secondary" id="cancel-product-btn" type="button">Cancel</button></div><p id="product-form-message"></p></form></section>
  <section class="card"><div style="display:flex;justify-content:space-between"><h3>Inventory 🔒</h3><span class="pill">${filtered.length}</span></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Bag Wt</th><th>Cost</th><th>Price</th><th>Value</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><strong>${escapeHTML(p.name)}</strong><br><small style="color:var(--muted)">${escapeHTML(p.category)}</small></td><td>${p.quantity} ${escapeHTML(p.unit)}</td><td>${p.unit==='bags'?p.bag_weight+' kg':'-'}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.quantity*p.cost)}</td></tr>`).join("")||`<tr><td colspan="6">No products</td></tr>`}</tbody></table></div></section>`;
}
function renderSales(){
  return `<h2>Sales — ${escapeHTML(currentShop?currentShop.name:'')} 🔒</h2>
  <section class="card"><h3>Record New Sale</h3><form id="sale-form"><div class="form-grid">
  <label>Product *<select class="field" name="saleProduct" id="saleProduct" required><option value="">Choose</option>${demoProducts.map(p=>`<option value="${p.id}">${escapeHTML(p.name)} — ${p.quantity} ${escapeHTML(p.unit)} ${p.unit==='bags'?'('+p.bag_weight+'kg)':''} @ ${money(p.price)}</option>`).join("")}</select></label>
  <label>Sale Unit *<select class="field" name="saleUnit" id="saleUnit" required><option value="bags">Bags</option><option value="kg">Kgs (loose)</option></select><small id="bagInfo" style="color:var(--muted)"></small></label>
  <label>Quantity *<input class="field" name="saleQty" id="saleQty" type="number" min="0.01" step="any" required><small id="calcPreview" style="color:var(--green);font-weight:700"></small></label>

  </div><div style="margin-top:12px"><button class="primary" type="submit">Record Sale Live</button></div><p id="sale-msg"></p></form></section>
  <section class="card"><h3>All Live Sales</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Pay</th></tr></thead><tbody>${demoSales.map(s=>`<tr><td>${s.date}</td><td>${escapeHTML(s.product)}</td><td>${s.quantity} ${escapeHTML(s.unit)}</td><td>${money(s.amount)}</td><td><span class="pill">${escapeHTML(s.payment)}</span></td></tr>`).join("")||`<tr><td colspan="5">No sales</td></tr>`}</tbody></table></div></section>`;
}

  </section>

  <section class="card"><h3>🔒 Change Shop Password — Eye Icon</h3>
    <form id="change-pass-form"><div class="form-grid" style="grid-template-columns:1fr">
      <label>Current Password *
        <div class="passInputWrap"><input class="field" id="currPass" type="password" required placeholder="Enter current"><button class="eyeBtn" type="button" data-target="currPass">👁️</button></div>
      </label>
      <label>New Password * (not forced 123)
        <div class="passInputWrap"><input class="field" id="newPass" type="password" required placeholder="e.g. Mwea@2025!"><button class="eyeBtn" type="button" data-target="newPass">👁️</button></div>

function renderBasic(t,d){return `<h2>${t} — ${escapeHTML(currentShop?currentShop.name:'')} 🔒</h2><p style="color:var(--muted)">${d}</p><section class="card"><div class="empty">Planned next — Locked Shop #${currentShop?currentShop.id:''}</div></section>`;}
function render(){
  renderNavigation();
  const c=document.getElementById("main-content");
  const pages={"Dashboard":renderDashboard,"Products":renderProducts,"Stock":()=>renderBasic("Stock","Stock overview"),"Sales":renderSales,"Customers / Debts":renderDebts,"Suppliers":()=>renderBasic("Suppliers","Suppliers"),"Expenses":()=>renderBasic("Expenses","Expenses"),"Reports":()=>renderBasic("Reports","Reports"),"Staff":()=>renderBasic("Staff","Staff"),"Settings":renderSettings};
  c.innerHTML=(pages[currentPage]||renderDashboard)();
  c.querySelectorAll("[data-page]").forEach(b=>{b.addEventListener("click",()=>{currentPage=b.dataset.page;render()})});
  const addBtn=document.getElementById("add-product-btn"); const panel=document.getElementById("add-product-panel"); const form=document.getElementById("add-product-form");
  const unitSelect=document.getElementById("unitSelect"); const bagWeightLabel=document.getElementById("bagWeightLabel"); const bagWeightSelect=document.getElementById("bagWeightSelect");
  function toggleBagWeight(){ if(!unitSelect||!bagWeightLabel) return; bagWeightLabel.style.display=unitSelect.value==='bags'?'block':'none'; if(bagWeightSelect) bagWeightSelect.required=unitSelect.value==='bags'; }
  if(unitSelect){unitSelect.addEventListener("change",toggleBagWeight); toggleBagWeight();}
  if(addBtn){addBtn.addEventListener("click",()=>{panel.hidden=false; panel.scrollIntoView({behavior:"smooth"})})}
  const cancel=document.getElementById("cancel-product-btn"); if(cancel) cancel.addEventListener("click",()=>{panel.hidden=true});
  const seedBtn=document.getElementById("seed-btn");
  if(seedBtn){seedBtn.addEventListener("click",async()=>{
    if(!currentShop){alert('Login first');return;}
    const demo=[{name:'Omena (Fish Meal)',category:'Animal Feeds',quantity:20,unit:'bags',bag_weight:50,cost:2800,price:3200},{name:'Sunflower Cake',category:'Animal Feeds',quantity:15,unit:'bags',bag_weight:50,cost:2200,price:2600},{name:'Black Gold - Dairy',category:'Animal Feeds',quantity:25,unit:'bags',bag_weight:70,cost:2400,price:2800},{name:'Layers Mash',category:'Animal Feeds',quantity:30,unit:'bags',bag_weight:50,cost:2500,price:2900},{name:'Growers Mash',category:'Animal Feeds',quantity:20,unit:'bags',bag_weight:70,cost:2300,price:2700},{name:'Chick Mash',category:'Animal Feeds',quantity:15,unit:'bags',bag_weight:70,cost:2600,price:3000},{name:'Kienyeji Mash',category:'Animal Feeds',quantity:18,unit:'bags',bag_weight:50,cost:2400,price:2800},{name:'Dairy Meal',category:'Animal Feeds',quantity:22,unit:'bags',bag_weight:70,cost:2350,price:2750},{name:'Maize Germ',category:'Animal Feeds',quantity:30,unit:'bags',bag_weight:50,cost:1800,price:2100},{name:'Wheat Bran',category:'Animal Feeds',quantity:25,unit:'bags',bag_weight:50,cost:1500,price:1800},{name:'Cotton Cake',category:'Animal Feeds',quantity:12,unit:'bags',bag_weight:50,cost:2100,price:2500},{name:'Maize Grain 90kg',category:'Animal Feeds',quantity:10,unit:'bags',bag_weight:90,cost:4000,price:4500},{name:'DCP Mineral',category:'Animal Feeds',quantity:50,unit:'kg',bag_weight:1,cost:120,price:150},{name:'Layers Booster',category:'Veterinary Products',quantity:100,unit:'packets',bag_weight:1,cost:200,price:300},{name:'Aflatoxin Binder',category:'Veterinary Products',quantity:80,unit:'packets',bag_weight:1,cost:180,price:250}];
    const toInsert=demo.map(d=>({...d,shop_id:currentShop.id}));
    const {error}=await supa.from('products').insert(toInsert);
    if(error) alert(error.message); else await loadAll();
  });}
  if(form){form.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(form); const name=String(fd.get("productName")||"").trim(); const category=String(fd.get("category")||""); const unit=String(fd.get("unit")||""); const bag_weight=unit==='bags'?Number(fd.get("bag_weight")):1; const quantity=Number(fd.get("quantity")); const cost=Number(fd.get("cost")); const price=Number(fd.get("price")); const msg=document.getElementById("product-form-message"); if(!name||!category||!unit){msg.textContent="Fill all";return;} msg.textContent="Saving..."; const {error}=await supa.from('products').insert([{name,category,quantity,unit,bag_weight,cost,price,shop_id:currentShop.id}]); if(error){msg.textContent=error.message;} else await loadAll(); });}
  const search=document.getElementById("product-search"); if(search){search.addEventListener("input",ev=>{searchTerm=ev.target.value; render(); const n=document.getElementById("product-search"); if(n){n.focus(); n.selectionStart=n.value.length}})}
  const filt=document.getElementById("category-filter"); if(filt){filt.addEventListener("change",ev=>{productFilter=ev.target.value; render()})}
  const saleForm=document.getElementById("sale-form"); const saleProd=document.getElementById("saleProduct"); const saleUnit=document.getElementById("saleUnit"); const saleQty=document.getElementById("saleQty"); const calc=document.getElementById("calcPreview"); const bagInfo=document.getElementById("bagInfo");
  function updatePreview(){
    if(!saleProd||!saleQty) return; const prodId=Number(saleProd.value); const qty=Number(saleQty.value); const sUnit=saleUnit?saleUnit.value:"bags"; const prod=demoProducts.find(p=>p.id===prodId);
    if(!prod||!qty){if(calc) calc.textContent=""; if(bagInfo) bagInfo.textContent=""; return;}
    if(bagInfo) bagInfo.textContent=prod.unit==='bags'?`This product: 1 bag = ${prod.bag_weight}kg`:`Stored as ${prod.unit}`;
    let pricePerUnit=prod.price; if(prod.unit==='bags' && sUnit==='kg') pricePerUnit=prod.price/prod.bag_weight; if(prod.unit==='kg' && sUnit==='bags') pricePerUnit=prod.price*prod.bag_weight;
    const amount=qty*pricePerUnit; if(calc) calc.textContent=`= ${money(amount)} (${qty} ${sUnit} @ ${money(pricePerUnit)}/${sUnit})`;
  }
  if(saleProd){saleProd.addEventListener("change",updatePreview);} if(saleUnit){saleUnit.addEventListener("change",updatePreview);} if(saleQty){saleQty.addEventListener("input",updatePreview);}
  if(saleForm){saleForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(saleForm); const prodId=Number(fd.get("saleProduct")); const qty=Number(fd.get("saleQty")); const sUnit=String(fd.get("saleUnit")); const pay=String(fd.get("salePay")); const msg=document.getElementById("sale-msg"); const prod=demoProducts.find(p=>p.id===prodId); if(!prod){msg.textContent="Choose product";return;}
    let qtyToDeduct=qty; if(prod.unit==='bags' && sUnit==='kg') qtyToDeduct=qty/prod.bag_weight; else if(prod.unit==='kg' && sUnit==='bags') qtyToDeduct=qty*prod.bag_weight;
    if(qtyToDeduct>prod.quantity){msg.textContent=`Not enough! Only ${prod.quantity} ${prod.unit} left.`; msg.style.color="#b83232"; return;}
    let pricePerUnit=prod.price; if(prod.unit==='bags' && sUnit==='kg') pricePerUnit=prod.price/prod.bag_weight; if(prod.unit==='kg' && sUnit==='bags') pricePerUnit=prod.price*prod.bag_weight;
    const amount=qty*pricePerUnit; msg.textContent=`Recording ${qty} ${sUnit} = ${money(amount)}...`;
    const {error:insErr}=await supa.from('sales').insert([{product_name:prod.name,quantity:qty,unit:sUnit,amount:amount,payment:pay,shop_id:currentShop.id}]);
    if(insErr){msg.textContent=insErr.message;msg.style.color="#b83232";return;}
    const newQty=prod.quantity-qtyToDeduct; const {error:upErr}=await supa.from('products').update({quantity:newQty}).eq('id',prodId);
    if(upErr){msg.textContent=upErr.message;return;} msg.textContent=`✅ ${qty} ${sUnit} = ${money(amount)} Saved!`; msg.style.color="#087443"; await loadAll();
  });}
  const debtForm=document.getElementById("debt-form"); if(debtForm){debtForm.addEventListener("submit",async e=>{e.preventDefault(); const fd=new FormData(debtForm); const name=String(fd.get("custName")||"").trim(); const phone=String(fd.get("custPhone")||"").trim(); const amount=Number(fd.get("custAmount")); const msg=document.getElementById("debt-msg"); if(!name||!amount){msg.textContent="Fill";return;} msg.textContent="Saving..."; const {error}=await supa.from('customers').insert([{name,phone,amount,shop_id:currentShop.id}]); if(error){msg.textContent=error.message;} else {msg.textContent="Saved"; await loadAll();}});}
  const changeForm=document.getElementById("change-pass-form");
  if(changeForm){
    changeForm.addEventListener("submit",async e=>{
      e.preventDefault();
      const curr=document.getElementById("currPass").value; const newP=document.getElementById("newPass").value; const conf=document.getElementById("confirmPass").value;
      const msg=document.getElementById("changePassMsg");
      if(!curr||!newP||!conf){msg.textContent="Fill all"; msg.style.color="#b83232"; return;}
      if(newP!==conf){msg.textContent="❌ Don't match!"; msg.style.color="#b83232"; return;}
      if(newP.length<4){msg.textContent="Min 4 chars"; msg.style.color="#b83232"; return;}
      msg.textContent="Checking..."; msg.style.color="#718278";
      const {data,error}=await supa.from('shops').select('*').eq('id',currentShop.id).single();
      if(error){msg.textContent=error.message; msg.style.color="#b83232"; return;}
      if(data.password && data.password!==curr){msg.textContent="❌ Current wrong!"; msg.style.color="#b83232"; return;}
      const {error:upErr}=await supa.from('shops').update({password:newP}).eq('id',currentShop.id);
      if(upErr){msg.textContent=upErr.message; msg.style.color="#b83232"; return;}
      msg.textContent=`✅ Password changed to ${newP} — eye icon verified`;
      msg.style.color="#087443";
      await renderShopList();
    });
  }
  const logoutSet=document.getElementById("logoutFromSettings");
  if(logoutSet){logoutSet.addEventListener("click",()=>{localStorage.removeItem('farmgate_current_shop'); currentShop=null; demoProducts=[]; demoSales=[]; demoDebts=[]; document.getElementById('loginOverlay').style.display='flex'; document.getElementById('passSection').style.display='none'; renderShopList();});}
}
initLogin();
</script></body></html>
